function buildExam(){
  var w=ExamWizard;
  var pool={};
  AppState.questions.forEach(function(q){
    if(w.banks.length && w.banks.indexOf(q.bankId)<0) return;
    if(w.types.indexOf(q.type)<0) return;
    (pool[q.type]=pool[q.type]||[]).push(q);
  });
  var sum=w.types.reduce(function(a,t){ return a+(w.ratios[t]||0); },0);
  if(!sum){ toast('请至少为一个题型分配比例'); return; }
  var paper=[];
  var remain=w.total;
  w.types.forEach(function(t, i){
    var arr=shuffle((pool[t]||[]).slice());
    var cnt = (i===w.types.length-1)? remain : Math.min(arr.length, Math.round(w.total*(w.ratios[t]||0)/sum));
    cnt=Math.max(0, Math.min(cnt, arr.length));
    paper=paper.concat(arr.slice(0,cnt));
    remain-=cnt;
  });
  /* 若仍有余量，从剩余可选题中补齐 */
  if(paper.length<w.total){
    var left=[];
    w.types.forEach(function(t){ (pool[t]||[]).forEach(function(q){ if(paper.indexOf(q)<0) left.push(q); }); });
    shuffle(left);
    paper=paper.concat(left.slice(0, Math.max(0, w.total-paper.length)));
  }
  if(!paper.length){ toast('没有可用题目'); return; }
  /* 固定题型顺序：填空 → 选择（单选/多选）→ 判断 → 大题；同题型内保持稳定（不再全局乱序） */
  var EXAM_ORDER=['fill','single','multiple','judge','short'];
  paper=paper.slice().sort(function(a,b){
    var ia=EXAM_ORDER.indexOf(a.type), ib=EXAM_ORDER.indexOf(b.type);
    ia=ia<0?99:ia; ib=ib<0?99:ib;
    return ia-ib;
  });
  AppState.session = {
    view:'exam', mode:'exam', title:'模拟考试', list:paper, idx:0, answers:{}, results:{},
    startedAt: Date.now(), endAt: Date.now()+w.duration*60000, finished:false, active:true,
    correct:0, wrong:0, flags:{}, examCfg:{duration:w.duration, ratios:JSON.parse(JSON.stringify(w.ratios))}
  };
  go('exam');
}
var timerId=null;
function startTimer(s){
  clearInterval(timerId);
  timerId=setInterval(function(){
    if(!AppState.session || AppState.session!==s || s.finished){ clearInterval(timerId); return; }
    var left=s.endAt-Date.now();
    var el=$('#timer');
    if(el){ el.textContent='⏱ '+fmtDur(Math.max(0,left)); if(left<60000) el.className='badge red'; }
    if(left<=0){ clearInterval(timerId); toast('时间到，自动交卷'); autoSubmit(s); }
  }, 1000);
}
/* 交卷 / 核算期间的全屏遮罩：锁住交互并给出明确提示，避免用户误以为「卡死」而连点交卷导致重复出成绩 */
function showSubmittingOverlay(msg){
  var el=document.getElementById('examSubmitting');
  if(!el){
    el=document.createElement('div');
    el.id='examSubmitting';
    el.className='exam-submitting';
    el.style.cssText='position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(18,26,46,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)';
    el.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px 26px;box-shadow:0 14px 44px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;gap:14px;max-width:82%;text-align:center">'+
      '<div class="spinner" style="width:30px;height:30px;border-width:4px"></div>'+
      '<div class="strong" id="examSubmittingMsg" style="font-size:15px">正在生成成绩单…</div>'+
      '<div class="tiny muted">请稍候，正在核算成绩</div></div>';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.style.opacity='1'; });
  } else {
    el.style.display='flex';
    requestAnimationFrame(function(){ el.style.opacity='1'; });
    var m=el.querySelector('#examSubmittingMsg'); if(m) m.textContent=msg||'正在生成成绩单…';
  }
}
function hideSubmittingOverlay(){
  var el=document.getElementById('examSubmitting');
  if(el){ el.style.opacity='0'; setTimeout(function(){ el.style.display='none'; }, 220); }
}
function confirmSubmit(s){
  var un=s.list.filter(function(q,i){ return !hasAnswer(q, s.answers[i]); }).length;  /* [OPT-06] 按真实作答统计未答 */
  var msg = un? ('还有 <b>'+un+'</b> 道题未作答，未作答将记 0 分。<br>确认现在交卷吗？') : '所有题目均已作答，确认交卷？';
  confirmBox('交卷', msg, '确认交卷', function(){ submitExam(); });
}
function autoSubmit(s){
  /* [OPT-11] 到时收卷：仅真未作答记 0 分；已作答但未落分的题交由 submitExam 统一结算 */
  s.list.forEach(function(q,i){ if(!hasAnswer(q, s.answers[i])) s.results[i]={correct:false, score:0, note:'未作答'}; });
  submitExam();
}
function submitExam(){
  var s=AppState.session;
  /* 防重入：正在提交或已交卷则直接忽略，避免用户连点「交卷」导致重复生成成绩单、重复记录成绩 */
  if(!s || s._submitting || s.finished) return;
  s._submitting=true;
  /* [OPT-06b] 交卷前统一结算：凡已作答但尚未落分（键盘作答/答题卡跳题等遗漏路径）的题目，
     按最新答案本地判分或（简答+已配 AI）发起 AI 评分并等待，避免被误计为 0 分/未作答 */
  var jobs=[];
  s.list.forEach(function(q,i){
    var r=s.results[i];
    if(r && r.aiPending && aiGradeJobs[q.id]){ jobs.push(aiGradeJobs[q.id]); return; }
    if(!r && hasAnswer(q, s.answers[i])){
      if(q.type==='short' && llmConfigured()){
        s.results[i]={correct:false, score:0, note:''};
        var rr=s.results[i]; rr.gradedBy='ai'; rr.aiPending=true;
        var jb=gradeShortWithAI(q, s.answers[i]).then(function(sc){
          rr.score=clamp(sc/100,0,1); rr.correct=(sc>=AppState.settings.scoring.shortPass);
          rr.short={score:sc, ai:true}; rr.aiPending=false;
        }).catch(function(){ rr.aiPending=false; });
        aiGradeJobs[q.id]=jb; jobs.push(jb);
      } else {
        s.results[i]=judgeAnswer(q, s.answers[i]);
      }
    }
  });
  s.finished=true; s.active=false;
  clearInterval(timerId);
  hideJumpPad();
  /* 立即用全屏遮罩锁住交互并给出明确提示：后台评分 / 核算期间前台不再「假死」，杜绝连点交卷 */
  showSubmittingOverlay(jobs.length ? 'AI 阅卷评分中，正在生成成绩单…' : '正在生成成绩单…');
  /* 等待 AI 评分中的简答题完成，避免用本地旧分生成成绩单（15s 兜底防 AI 挂起卡死交卷） */
  var go=function(){ hideSubmittingOverlay(); finishExam(s); };
  if(jobs.length){
    var bail=new Promise(function(res){ setTimeout(res, 15000); });
    Promise.race([Promise.all(jobs.map(function(p){ return p.catch(function(){}); })), bail]).then(go, go);
  } else go();
}
function finishExam(s){
  var total=s.list.length, got=0, correctN=0, wrongs=[];
  var byType={};
  s.list.forEach(function(q,i){
    var r=s.results[i];
    if(!r){ r={correct:false, score:0, note:'未作答'}; s.results[i]=r; }
    got += (r.score||0);
    if(r.correct) correctN++; else wrongs.push(q);
    var t=byType[q.type]||{n:0,ok:0}; t.n++; if(r.correct) t.ok++; byType[q.type]=t;
  });
  var score=Math.round(got/total*100);
  var duration=Date.now()-s.startedAt;
  var examData = {
    total: total, duration: Math.round(duration/1000), score: score,
    answers: s.list.map(function(q,i){
      return { qId:q.id, question:qTitle(q), type:q.type,
        userAnswer: fmtUserAnswer(q, s.answers[i]), correctAnswer: answerDisplay(q),
        isCorrect: !!(s.results[i] && s.results[i].correct), analysis: q.analysis||'' };
    })
  };
  var rec={ id:uid('ex'), date:Date.now(), score:score, accuracy: correctN/total, total:total, correct:correctN,
            duration:duration, wrongIds:wrongs.map(function(q){ return q.id; }), byType:byType,
            answers: examData.answers };
  AppState.exams.unshift(rec);
  DB.put('exams', rec).catch(function(){});
  var typeRows=Object.keys(byType).map(function(t){
    var b=byType[t];
    return '<tr><td>'+TYPE_NAME[t]+'</td><td>'+b.n+'</td><td>'+b.ok+'</td><td>'+Math.round(b.ok/b.n*100)+'%</td></tr>';
  }).join('');
  var body =
    '<div class="grid g4" style="gap:10px">'+
      statMini('得分', score)+statMini('正确率', Math.round(correctN/total*100)+'%')+
      statMini('用时', fmtDur(duration))+statMini('错题', wrongs.length)+
    '</div>'+
    '<div class="mt16"><div class="label">分题型统计</div>'+
      '<table class="tbl mt4"><thead><tr><th>题型</th><th>题数</th><th>答对</th><th>正确率</th></tr></thead><tbody>'+typeRows+'</tbody></table></div>'+
    (wrongs.length?'<div class="mt16"><div class="label">错题（'+wrongs.length+'）</div>'+
      '<div style="max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:var(--r2);padding:10px">'+
      wrongs.slice(0,60).map(function(q,i){
        return '<div class="small" data-wq="'+q.id+'" style="padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer">'+
          '<span class="badge">'+TYPE_SHORT[q.type]+'</span> '+esc(qTitle(q).slice(0,60))+'</div>';
      }).join('')+'</div></div>':'<div class="mt16 center" style="padding:14px"><div style="font-size:28px">🎯</div><div class="strong mt8">全部正确，完美！</div></div>');
  Modal.open({
    title:'成绩报告单',
    sub: new Date().toLocaleString('zh-CN'),
    body: body,
    foot:
      '<button class="btn" id="noImp">不导入</button>'+(wrongs.length?'<button class="btn primary" id="imp">一键导入错题本</button>':'<button class="btn primary" data-close>完成</button>'),
    /* 关闭成绩单（叉号 / 点遮罩 / Esc / 任意关闭路径）统一结束模考会话，避免交卷后关弹窗却卡在「已交卷」、所有交卷入口被 guarded 拦截的死局 */
    onClose: function(){ AppState.session=null; render(); },
    onMount: function(m){
      m.querySelectorAll('[data-wq]').forEach(function(el){
        el.onclick=function(){ openQuestionDetail(AppState.qMap.get(el.getAttribute('data-wq'))); };
      });

      var imp=m.querySelector('#imp');
      if(imp) imp.onclick=function(){
        /* 只把答错的题计入 SRS/错题本；答对题不动学习记录，避免污染间隔重复调度 */
        var n=0;
        s.list.forEach(function(q,i){
          var r=s.results[i];
          if(r && r.correct===false){ updateStat(q.id, false, 1); n++; }
        });
        dailyAdd(n);
        Modal.close(m); toast('已导入 '+n+' 道错题'); AppState.session=null; render();
      };
      var no=m.querySelector('#noImp');
      if(no) no.onclick=function(){ Modal.close(m); AppState.session=null; render(); };
    }
  });
}
/* [OPT-10] 死代码：openAnswerSheet 无入口（#sheetBtn 不存在，题卡 FAB 已替代），建议整体删除 */
function openAnswerSheet(s){
  var html='<div class="row wrap gap8">'+ s.list.map(function(q,i){
    var r=s.results[i], a=s.answers[i];
    var cls = r? (r.correct?'green':(r.score>0?'orange':'red')) : (hasAnswer(q,a)?'blue':'');
    return '<div class="chip" data-j="'+i+'" style="width:44px;justify-content:center;'+
      (cls==='green'?'background:var(--green);border-color:var(--green);color:#fff;':
       cls==='red'?'background:var(--red);border-color:var(--red);color:#fff;':
       cls==='orange'?'background:var(--orange);border-color:var(--orange);color:#fff;':
       cls==='blue'?'background:var(--blue);border-color:var(--blue);color:#fff;':'')+'">'+
      (i+1)+(s.flags[i]?'★':'')+'</div>';
  }).join('')+'</div>';
  Modal.open({
    title:'答题卡',
    sub:'已答 '+Object.keys(s.results).length+' / '+s.list.length,
    body: html,
    foot:'<button class="btn" data-close>继续答题</button><button class="btn primary" id="sub2">交卷</button>',
    onMount: function(m){
      m.querySelectorAll('[data-j]').forEach(function(el){
        el.onclick=function(){ s.idx=parseInt(el.getAttribute('data-j'),10); Modal.close(m); refreshSessionArea(); };
      });
      m.querySelector('#sub2').onclick=function(){ Modal.close(m); confirmSubmit(s); };
    }
  });
}

        '<div class="row gap8" style="flex-wrap:wrap;row-gap:8px"><button class="btn sm" id="revBtn">开始复习</button><button class="btn sm" id="cardBtn">背题模式</button>'+
          '</div>'+
      '</div>'+
      '<div id="wlist" class="mt12" style="height:calc(100vh - 330px);min-height:320px"></div>';
  },
  mount: function(root){
    var tp=root.querySelector('#toPractice'); if(tp) tp.onclick=function(){ go('practice'); };
    var cm=$('#clearM');
    if(cm) cm.onclick=function(){
      var n=masteredCount();
      if(!n) return toast('没有已掌握的题目');
      confirmBox('清理已掌握','将把 '+n+' 道已掌握题目从错题本中彻底移除（学习记录保留）。','清理', function(){
        var arr=[]; AppState.stats.forEach(function(s){ if(s.mastered && s.inWrong){ s.inWrong=false; arr.push(s.qid); } });
        DB.bulkPut('stats', Array.from(AppState.stats.values())).then(function(){ toast('已清理 '+arr.length+' 题'); render(); });
      });
    };
    if(!wrongList().length) return;
    var filter='all';
    var host=root.querySelector('#wlist');
    function listOf(){
      var out=wrongList();
      if(filter!=='all') out=out.filter(function(q){ return q.type===filter; });
      out.sort(function(a,b){
        var sa=AppState.stats.get(a.id)||{}, sb=AppState.stats.get(b.id)||{};
        return (sb.wrongCount||0)-(sa.wrongCount||0);
      });
      return out;
    }
    var vl=mountVList(host, {
      items: listOf(),
      height: 84,
      render: function(q){
        var s=AppState.stats.get(q.id)||{};
        return '<div class="qitem"><div class="qitem-idx">'+typeBadge(q.type)+'</div><div class="qitem-main">'+
          '<div class="qitem-title ell2">'+esc(qTitle(q))+'</div>'+
          '<div class="row wrap gap8 mt8">'+
            '<span class="badge red">错 '+(s.wrongCount||0)+' 次</span>'+
            '<span class="badge">连续答对 '+(s.streak||0)+'/'+AppState.settings.srs.graduateCount+'</span>'+
            (s.lastWrongTime?'<span class="tiny muted">上次错误 '+fmtAgo(s.lastWrongTime)+'</span>':'')+
          '</div></div></div>';
      },
      onClick: function(q){ openQuestionDetail(q); }
    });
    root.querySelector('#wf').addEventListener('click', function(e){
      var c=e.target.closest('[data-t]'); if(!c) return;
      $$('#wf .chip').forEach(function(x){ x.classList.remove('active'); });
      c.classList.add('active'); filter=c.getAttribute('data-t'); vl.setItems(listOf());
    });
    var rb=root.querySelector('#revBtn');
    if(rb) rb.onclick=function(){ startSession({view:'practice', mode:'practice', list:shuffle(wrongList().slice()), title:'错题强化'}); };
    var cb=root.querySelector('#cardBtn');
    if(cb) cb.onclick=function(){ go('card', {list:listOf(), title:'错题背题', key:'wrong'}); };

  }
};

function mountAiAnalyzeView(root, type){
  var def=ANALYSIS[type]; if(!def) return;
  var host=root.querySelector('#aiHost'), hist=root.querySelector('#aiHist');
  function refresh(){ renderAiHistory(hist, type, root, function(){ mountAiAnalyzeView(root, type); }); }
  refresh();
  if(!llmConfigured()){
    host.innerHTML=aiNeedCfgHtml();
    var gs=host.querySelector('#aiGoSet'); if(gs) gs.onclick=function(){ go('settings'); };
    return;
  }
  getAnalysisCache().then(function(cache){
    var ctx0=def.getCtx([]);
    if(ctx0.empty){ host.innerHTML='<div class="card" style="padding:14px">'+ctx0.emptyMsg+'</div>'; return; }
    var hash0=hashStr(def.buildPrompt(ctx0));
    if(cache[type] && cache[type].hash===hash0 && cache[type].html){
      renderAiResult(host, type, def, {ts:cache[type].ts||Date.now(), html:cache[type].html, label:def.label}, refresh, root);
      return;
    }
    renderAiConfigInline(root, host, type, def, ctx0, refresh);
  });
}
function renderAiConfigInline(root, host, type, def, ctx0, refresh){
  AnalysisJobs[type]=AnalysisJobs[type]||{}; AnalysisJobs[type].configOpen=true;
  var hintMap={ review:'复盘你最近一次模拟考试', weekly:'汇总生成本周学习周报', passrate:'基于学习数据预测考试通过概率', rootcause:'仅分析所选题库的错题（不选＝全部题库）', diagnosis:'仅分析所选题库的错题（不选＝全部题库）' };
  var pick = def.needsBanks ? analysisBankPick() : null;
  host.innerHTML = (pick? pick.html : '') +
    '<div class="hint mt8">AI 将'+(hintMap[type]||'分析学习数据')+'。点「开始分析」生成报告，完成后可在下方「历史记录」中随时回看。</div>'+
    '<button class="btn primary mt12" id="anaGo">开始分析</button>';
  if(pick) pick.bind(host);
  var goBtn=host.querySelector('#anaGo');
  goBtn.onclick=function(){
    AnalysisJobs[type].configOpen=false;
    var banks = pick ? pick.get() : [];
    var ctx = def.getCtx(banks);
    if(ctx.empty){ toast(ctx.emptyMsg); return; }
    var hash = hashStr(def.buildPrompt(ctx));
    getAnalysisCache().then(function(c){
      if(c[type] && c[type].hash===hash && c[type].html){ renderAiResult(host, type, def, {ts:c[type].ts||Date.now(), html:c[type].html, label:def.label}, refresh, root); return; }
      startAiJobInline(host, type, def, ctx, hash, refresh, root);
    });
  };
}
function startAiJobInline(host, type, def, ctx, hash, refresh, root){
  if(AnalysisJobs[type] && AnalysisJobs[type].running){ toast(def.label+' 正在生成中，请稍候…'); return; }
  AnalysisJobs[type]=AnalysisJobs[type]||{}; AnalysisJobs[type].running=true;
  host.innerHTML='<div class="ai-box"><div class="ai-sec"><span class="spinner"></span> '+def.label+' 生成中<span class="dots"></span></div></div><div id="anaHost" class="ai-report"></div>';
  var rhost=host.querySelector('#anaHost');
  llmCall(def.buildPrompt(ctx), {tag:def.label}).then(function(txt){
    var html=def.render(txt, ctx);
    setAnalysisCache(type, {hash:hash, ts:Date.now(), html:html, raw:String(txt), label:def.label, sub:''});
    AnalysisJobs[type].running=false;
    renderAiResult(host, type, def, {ts:Date.now(), html:html, label:def.label}, refresh, root);
    aiSaveReport({ id:'rep_'+Date.now(), label:def.label, sub:'', html:html, ts:Date.now(), raw:String(txt), key:type });
    refresh();
  }).catch(function(e){
    AnalysisJobs[type].running=false;
    host.innerHTML='<div class="ai-box"><div class="ai-sec" style="color:var(--red)">生成失败：'+(e.message||e)+'</div><button class="btn sm mt8" id="anaRetry">重试</button></div>';
    var rb=host.querySelector('#anaRetry'); if(rb) rb.onclick=function(){ startAiJobInline(host, type, def, ctx, hash, refresh, root); };
    toast(def.label+' 失败：'+(e.message||e));
  });
}
function renderAiResult(host, type, def, entry, refresh, root){
  host.innerHTML='<div class="ai-report">'+entry.html+'</div>'+
    '<div class="row gap8 mt12"><button class="btn sm" id="aiRegen">重新生成</button></div>';
  var rep=host.querySelector('.ai-report'); if(rep) bindDiagToggles(rep);
  var rg=host.querySelector('#aiRegen');
  if(rg) rg.onclick=function(){
    var ctx=def.getCtx([]);
    if(ctx.empty){ toast(ctx.emptyMsg); return; }
    var hash=hashStr(def.buildPrompt(ctx))+'_'+Date.now();   /* 强制非命中缓存，重新生成 */
    startAiJobInline(host, type, def, ctx, hash, refresh, root);
  };
}
/* 每页历史记录（按 key 过滤——记录只展示在本功能页内，不再有全局「我的AI记录」） */
function renderAiHistory(host, key, root, onBack){
  if(!host) return;
  var list=AppState.aiHist.reports.filter(function(r){ return r.key===key; });
  if(!list.length){ host.innerHTML='<div class="tiny muted">暂无历史记录，生成后会出现在这里</div>'; return; }
  host.innerHTML=list.map(function(rec){
    return '<div class="ai-sec click" data-rep="'+rec.id+'" style="border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px;cursor:pointer">'+
      '<div class="row between"><div class="strong small">'+esc(rec.label)+'</div><span class="tiny muted">'+fmtAgo(rec.ts)+'</span></div>'+
      (rec.sub?'<div class="tiny muted mt4">'+esc(rec.sub)+'</div>':'')+'</div>';
  }).join('');
  host.querySelectorAll('[data-rep]').forEach(function(el){ el.onclick=function(){ showAiRecordInline(root, el.getAttribute('data-rep'), key, onBack); }; });
}
function showAiRecordInline(root, id, key, onBack){
  var rec=null; AppState.aiHist.reports.forEach(function(r){ if(r.id===id) rec=r; });
  if(!rec){ toast('记录已不存在'); return; }
  if(rec.list && rec.list.length){
    var qs=rec.list.map(function(x){ return AppState.qMap.get(x.id); }).filter(Boolean);
    if(qs.length){ startSession({view:'practice', mode:'practice', list:qs, title:rec.label}); return; }
    toast('题目已不在当前题库'); return;
  }
  var host=root.querySelector('#aiHost');
  host.innerHTML='<div class="ai-report">'+rec.html+'</div>'+
    '<div class="row gap8 mt12"><button class="btn sm" id="aiBackRec">← 返回</button></div>';
  var rep=host.querySelector('.ai-report'); if(rep) bindDiagToggles(rep);
  var bb=host.querySelector('#aiBackRec'); if(bb) bb.onclick=function(){ if(onBack) onBack(); };
}

function startCardMode(root, params){
  var list=params&&params.list, title=params&&params.title, resumeKey=params&&params.key;

/* 背题模式题卡配置：与模拟考试 / 刷题模式完全一致的「按题型分组」网格；
   背题无对错概念，状态只区分「已看（揭示过答案）/ 未看」，不暴露对或错 */
function cardPadCfg(){
  if(!CardMode) return { count:0, groups:[], getIdx:function(){return 0;}, onJump:function(){}, status:function(){return [];} };
  var seen={}, order=[], map={};
  CardMode.list.forEach(function(q,i){
    var t=q.type;
    if(!seen[t]){ seen[t]=true; order.push(t); map[t]=[]; }
    map[t].push(i);
  });
  var groups = order.map(function(t){ return {name: TYPE_NAME[t]||t, idx: map[t]}; });
  return {
    count: CardMode.list.length,
    groups: groups,
    getIdx: function(){ return CardMode? CardMode.i : 0; },
    onJump: function(i){ if(!CardMode) return; CardMode.i=i; CardMode.phase='q'; drawCard(); },
    status: function(){
      return CardMode.list.map(function(q, i){
        if(i===CardMode.i) return 'cur';

        return 'todo';

  };
}

/* LLM 调用（外层）：自动重试过载/网络错误（默认 2 次，指数退避），重试过程通过 opts.onRetry 通知 UI */
function llmCall(userContent, opts){
  opts=opts||{};
  var maxRetry=(opts.maxRetry!=null)? opts.maxRetry : 2;
  function attempt(n){
    return llmCallOnce(userContent, opts).catch(function(e){
      if(e && e.retriable && n<maxRetry){
        if(opts.onRetry) opts.onRetry(n+1, maxRetry, e.message||'');
        var delay = e.retryAfter>0 ? Math.min(8000, e.retryAfter*1000) : Math.min(8000, 1100*Math.pow(2,n)+Math.random()*400);
        return new Promise(function(res){ setTimeout(res, delay); }).then(function(){ return attempt(n+1); });
      }
      throw e;
    });
  }
  return attempt(0);
}
function llmCallOnce(userContent, opts){
  opts=opts||{};
  var c=AppState.settings.llm;
  var noDepth = !!opts.noDepth;
  var maxTok = opts.maxTokens || Math.max(256, Math.min(4096, Math.floor((c.contextWindow||8192)/4 * (noDepth?1:thinkTokFactor()))));
  var sysBase = (opts.sys || SYS_PROMPT) + (noDepth?'':thinkSuffix());   /* 评分类传 noDepth 跳过后缀；背题讲解等可经 opts.sys 覆盖系统提示 */
  var base=(c.baseUrl||'https://api.openai.com/v1').replace(/\/+$/,'');
  var url, headers, body;
  if(c.protocol==='anthropic'){
    url=base+'/messages';
    headers={'content-type':'application/json','x-api-key':c.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    body={ model:c.model, max_tokens:maxTok, temperature:Number(c.temperature)||0.3, system:sysBase,
           stream:!!opts.onChunk, messages:[{role:'user', content:userContent}] };
  }else{
    url=base+'/chat/completions';
    headers={'content-type':'application/json','Authorization':'Bearer '+c.apiKey};
    body={ model:c.model, temperature:Number(c.temperature)||0.3, max_tokens:maxTok, stream:!!opts.onChunk,
           messages:[{role:'system', content:sysBase},{role:'user', content:userContent}] };
  }
  var tag=opts.tag||'其他', t0=Date.now();
  /* 解析非流式 JSON 响应为纯文本（与流式解析共用，便于流式失败时回退，保证一定有结果） */
  function parseNonStream(t){
    var data; try{ data=JSON.parse(t); }catch(e){ throw new Error('响应解析失败：'+t.slice(0,120)); }
    var txt='';
    if(data.choices && data.choices[0] && data.choices[0].message) txt=data.choices[0].message.content;
    else if(data.content && data.content[0]) txt=data.content[0].text;
    else if(data.output_text) txt=data.output_text;
    else txt=JSON.stringify(data).slice(0,400);
    return String(txt||'').trim();
  }
  return fetch(url, {method:'POST', headers:headers, body:JSON.stringify(body), signal:opts.signal}).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var d=null; try{ d=JSON.parse(t); }catch(e){}
        var err=new Error((d && d.error && (d.error.message||d.error)) || ('HTTP '+r.status));
        /* 过载/限流/服务端错误 → 自动重试；参数与鉴权错误不重试 */
        err.retriable = (r.status===429 || r.status===408 || r.status>=500);
        var ra=parseInt(r.headers && r.headers.get ? (r.headers.get('retry-after')||'0') : '0', 10);
        if(ra>0) err.retryAfter=ra;
        throw err;
      });
    }
    if(opts.onChunk && r.body && r.body.getReader){
      /* 流式：SSE 逐块读取，onChunk(累计文本, 本次增量) */
      var reader=r.body.getReader(), dec=new TextDecoder('utf-8'), buf='', full='';

          frames.forEach(function(fr){
            fr.split(/\n/).forEach(function(line){
              line=line.trim();
              if(line.indexOf('data:')!==0) return;
              var pl=line.slice(5).trim();
              if(pl==='[DONE]') return;
              var j=null; try{ j=JSON.parse(pl); }catch(e){ return; }
              var delta='';
              if(j.choices && j.choices[0]){ var d0=j.choices[0].delta||j.choices[0].message||{}; delta=d0.content||''; }
              else if(j.type==='content_block_delta' && j.delta) delta=j.delta.text||'';
              if(delta){ full+=delta; opts.onChunk(full, delta); }
            });
          });
          return pump();
        });
      }
      return pump().then(function(full2){
        if(full2 && full2.trim()){ recordAiUsage(tag, estTokens(userContent), estTokens(full2)); return full2.trim(); }
        /* 流式解析为空（接口不兼容 SSE / 实际未返回可解析的增量）→ 回退非流式重新请求一次，保证一定有文字 */
        return fetch(url, {method:'POST', headers:headers, body:JSON.stringify(Object.assign({}, body, {stream:false})), signal:opts.signal})
          .then(function(r2){ return r2.text(); }).then(function(t){ var txt=parseNonStream(t); recordAiUsage(tag, estTokens(userContent), estTokens(txt)); return txt; });
      });
    }
    /* 非流式（回退批量模式） */
    return r.text().then(function(t){ var txt=parseNonStream(t); recordAiUsage(tag, estTokens(userContent), estTokens(txt)); return txt; });
  }).catch(function(e){
    if(e && e.name==='AbortError') throw e;
    if(e && e.retriable===undefined && /failed to fetch|networkerror|load failed/i.test(String(e && e.message || e))){
      e.retriable=true;   /* 网络层错误：尚未输出任何内容，重试安全 */
    }
    var msg=(e && e.message)||String(e);
    if(/failed to fetch|networkerror|load failed|fetch/i.test(msg)){
      toast('网络请求失败，请检查网络与 API 配置');
      throw new Error('网络请求失败，请检查网络或 API 配置（Base URL / API Key / 模型）。');
    }

  });

function parseAI(text){
  var t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  var out={a:'', b:'', c:''};
  if(t.charAt(0)==='{' || t.charAt(0)==='['){
    try{
      var o=JSON.parse(t);
      if(Array.isArray(o)) o=o[0]||{};
      var keys=Object.keys(o);
      function find(re){ for(var i=0;i<keys.length;i++){ if(re.test(keys[i])) return o[keys[i]]; } return ''; }
      out.a=String(find(/错因|为什么错|错误原因|原因/)||'');
      out.b=String(find(/正确|为什么对|答案解析|解析/)||'');
      out.c=String(find(/口诀|记忆|要点|技巧/)||'');
      if(out.a||out.b||out.c) return out;
    }catch(e){}
  }
  /* 纯文本容错：按小标题切分 */
  var lines=t.split(/\n+/), cur='a';
  lines.forEach(function(line){
    var s=line.trim(); if(!s) return;
    if(/^[{【]?\s*(一|1|①|1\)|【)?\s*(错因|错误原因|为什么错|用户答案)/.test(s) || /错因分析/.test(s)) { cur='a'; s=s.replace(/^[^：:]*[：:]/,''); }
    else if(/正确答案|为什么对|解析|二|2\)|②/.test(s) && cur==='a'){ cur='b'; s=s.replace(/^[^：:]*[：:]/,''); }
    else if(/口诀|记忆|要点|三|3\)|③/.test(s)){ cur='c'; s=s.replace(/^[^：:]*[：:]/,''); }
    out[cur] += (out[cur]?' ':'') + s;
  });
  if(!out.a && !out.b && !out.c) out.a=t;
  return out;
}

function makeTyper(el){
  /* 每 20ms 输出一批字符；积压越多加速，保证长文也能及时追上流 */
  var buf='', done=false, started=false;
  function tick(){
    if(done && !buf.length) return;
    if(buf.length){
      var n=Math.max(1, Math.ceil(buf.length/40));
      el.textContent += buf.slice(0,n);
      buf=buf.slice(n);
    }
    setTimeout(tick, 20);
  }
  return {
    push:function(s){ buf+=s; if(!started){ started=true; tick(); } },
    end:function(){ done=true; },
    text:function(){ return el.textContent; }
  };
}

function parseAIJSON(text){

  try{ return JSON.parse(t); }catch(e){}
  var m=t.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  m=t.match(/\[[\s\S]*\]/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}

/* ============================================================

 *       ④ 关闭后无法回看 → 后台跑完弹通知，再次点击看缓存结果

var AnalysisCache = null;        /* 懒加载：{ type:{hash,ts,html,raw,label,sub} } */
var AnalysisJobs  = {};          /* type -> {running, configOpen, m} */

function hashStr(s){
  s=String(s); var h=2166136261>>>0;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h.toString(36);
}
function getAnalysisCache(){
  if(AnalysisCache) return Promise.resolve(AnalysisCache);
  return DB.get('settings','analysis_cache').then(function(r){ AnalysisCache=(r&&r.value)||{}; return AnalysisCache; })
    .catch(function(){ AnalysisCache={}; return AnalysisCache; });
}
function setAnalysisCache(type, entry){
  return getAnalysisCache().then(function(c){ c[type]=entry; AnalysisCache=c; return DB.put('settings',{key:'analysis_cache', value:c}); });
}
/* 背题模式「AI 讲解本题」缓存：按 题号+思考深度 存原文，命中即直接展示，不重复请求、不浪费 token */

function setCardExplainCache(key, txt){

}

/* 各分析类型定义：getCtx(银行ids) 返回数据上下文与空校验；buildPrompt/render 复用既有函数 */

/* 入口：点击功能按钮 */
function runAiAnalysis(type){
  var def=ANALYSIS[type]; if(!def) return;
  if(!llmConfigured()){ toast('请先在设置中配置 API Key'); return; }
  if(AnalysisJobs[type] && AnalysisJobs[type].configOpen){ return; }   /* 配置弹窗已开，避免连点重复 */
  if(AnalysisJobs[type] && AnalysisJobs[type].running){ toast(def.label+' 正在后台分析中，请稍候…'); return; }
  getAnalysisCache().then(function(cache){
    var ctx0=def.getCtx([]);
    if(ctx0.empty){ toast(ctx0.emptyMsg); return; }
    var hash0=hashStr(def.buildPrompt(ctx0));
    if(cache[type] && cache[type].hash===hash0){ openAnalysisResult(type, cache[type]); return; }  /* 数据未变，直接看上次结果 */
    openAnalysisConfig(type, def, ctx0);
  });
}
function openAnalysisConfig(type, def, ctx0){
  var pick=null, body;
  if(def.needsBanks){
    pick=analysisBankPick();
    body = pick.html +
      '<div class="hint mt8">仅分析所选题库的错题（不选＝全部题库）。点「开始分析」后 AI 后台运行，可关闭弹窗等待完成通知。</div>';
  } else {
    body = '<div class="hint">AI 将'+(type==='review'?'复盘你最近一次模拟考试':(type==='weekly'?'汇总生成本周学习周报':'基于学习数据预测考试通过概率'))+'。点「开始分析」后后台运行，可关闭弹窗等待完成通知。</div>';
  }
  AnalysisJobs[type]=AnalysisJobs[type]||{}; AnalysisJobs[type].configOpen=true;
  Modal.open({
    title:def.label, sub:'确认运行 · AI 分析',
    body:body,
    foot:'<button class="btn" data-close>取消</button><button class="btn primary" id="anaGo">开始分析</button>',
    onClose:function(){ if(AnalysisJobs[type]) AnalysisJobs[type].configOpen=false; },
    onMount:function(m){
      if(pick) pick.bind(m);
      m.querySelector('#anaGo').onclick=function(){
        var banks = pick ? pick.get() : [];
        var ctx = def.getCtx(banks);
        if(ctx.empty){ toast(ctx.emptyMsg); return; }
        var hash=hashStr(def.buildPrompt(ctx));
        Modal.close(m);
        /* 选定范围与历史一致则不重算，直接展示 */
        getAnalysisCache().then(function(c){
          if(c[type] && c[type].hash===hash){ openAnalysisResult(type, c[type]); return; }
          startAnalysisJob(type, def, ctx, hash);
        });
      };
    }
  });
}
function startAnalysisJob(type, def, ctx, hash){
  if(AnalysisJobs[type] && AnalysisJobs[type].running){ toast(def.label+' 正在后台分析中…'); return; }
  AnalysisJobs[type]=AnalysisJobs[type]||{}; AnalysisJobs[type].running=true;
  var m=Modal.open({
    title:def.label, sub:'AI 正在分析（可关闭，后台继续）',
    body:'<div class="ai-box"><div class="ai-sec"><span class="spinner"></span> '+def.label+' 分析中<span class="dots"></span></div></div><div id="anaHost" class="ai-report"></div>',
    foot:'<button class="btn" data-close>关闭</button>',

      mm.querySelector('[data-close]').onclick=function(){ Modal.close(mm); toast('已在后台继续分析「'+def.label+'」，完成后会通知你'); };
    }
  });
  AnalysisJobs[type].m=m;

    var html=def.render(txt, ctx);

  });
}

/* ---------- 功能二：智能加练（AI 选题） ---------- */
function buildWeakPoints(){
  var m={}; wrongList().forEach(function(q){ var k=(q.category||'未分类')+' · '+TYPE_NAME[q.type]; m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(a,b){ return b.n-a.n; }).slice(0,5)
    .map(function(x){ return x.k+' 错 '+x.n+' 次'; });
}
/* 隐私最小化：只取错得最多的 3 个章节的题目子集发给 AI（而非整个题库） */
function topWeakCategories(){
  var m={}; wrongList().forEach(function(q){ var k=q.category||'未分类'; m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(a,b){ return b.n-a.n; }).slice(0,3).map(function(x){ return x.k; });
}
function buildWeakPool(){
  var cats=topWeakCategories();
  if(!cats.length) return null;                       /* 无错题 → 不发 AI */
  var pool=AppState.questions.filter(function(q){ return cats.indexOf(q.category||'未分类')>=0; });
  return pool.slice(0, 200);                          /* 子集过大时截断，防 token 爆炸 */
}
function buildDrillPrompt(weakLines, reqText, count, byWrong, pool){
  var cats=topWeakCategories();
  var scope = (pool && cats.length)? '以下题目子集（来自你错得最多的 '+cats.length+' 个章节：'+cats.join('、')+'）' : '以下题库';
  return '你是一名题库出题专家。请从'+scope+'中选择题目来组一份针对用户的专项加练卷。\n\n'+
    '【用户薄弱点】\n'+(weakLines.length? weakLines.join('\n') : '（暂无错题记录，请按题型均衡选题）')+'\n\n'+
    '【题型和数量要求】\n'+reqText+'\n\n'+
    '【题库数据】\n'+JSON.stringify((pool||AppState.questions).map(function(q){
      return {id:q.id, question:qTitle(q), type:q.type, category:q.category||'未分类', answer:q.answer, analysis:q.analysis||''};
    }))+'\n\n'+
    '【要求】\n从题库中选出最适合用户当前薄弱点的题目，生成一组 JSON：[{"id": 题ID, "reason": "为什么选这道题"}, ...]\n'+
    '注意：只选题库中已有的题目ID，不要编造新题。总题数必须等于用户设置的题数（'+count+' 题）。'+(byWrong? '\n优先选择用户错得最多的知识点对应的题目。':'');
}
function normalizeDrill(arr, count, types){
  var seen={}, out=[];
  if(Array.isArray(arr)) arr.forEach(function(x){ if(x && AppState.qMap.has(x.id) && !seen[x.id]){ seen[x.id]=1; out.push({id:x.id, reason:x.reason||''}); } });
  if(out.length<count){
    var pool=shuffle(AppState.questions.filter(function(q){ return !seen[q.id] && (!types.length||types.indexOf(q.type)>=0); }).slice());
    for(var i=0;i<pool.length && out.length<count;i++){ out.push({id:pool[i].id, reason:'补充题（保持题量）'}); }
  }
  return out.slice(0, count);
}
function drillFallback(byWrong, types, count){
  var base = byWrong? wrongList() : AppState.questions.slice();
  if(!base.length) base=AppState.questions.slice();
  var pool=base.filter(function(q){ return !types.length||types.indexOf(q.type)>=0; });
  if(!pool.length) pool=base;
  return shuffle(pool.slice()).slice(0, count).map(function(q){ return {id:q.id, reason: byWrong?'你曾答错的题目':'随机抽题'}; });
}
function startDrillList(list){
  var qs=list.map(function(x){ return AppState.qMap.get(x.id); }).filter(Boolean);
  if(!qs.length){ toast('题目已不存在'); return; }
  startSession({view:'practice', mode:'practice', list:qs, title:'智能加练'});
}
function showDrillInline(resultHost, list){
  if(!resultHost) return;
  if(!list || !list.length){ toast('没有可选题目'); return; }
  /* 留痕：记录到本功能页的历史（key=drill），不再有全局「我的 AI 记录」 */
  aiSaveReport({ id:'drill_'+Date.now(), label:'智能加练', sub:list.length+' 题', list:list, html:'', ts:Date.now(), key:'drill' });
  resultHost.innerHTML='<div class="card" style="padding:14px"><div class="small muted">AI 根据你的薄弱点推荐了以下题目：</div>'+
    list.slice(0,8).map(function(x){ var q=AppState.qMap.get(x.id);
      return '<div class="weak-item"><span>'+esc(q?qTitle(q).slice(0,52):('ID '+x.id))+'</span><span class="tiny muted" style="flex:none;max-width:46%">'+esc(x.reason||'')+'</span></div>';
    }).join('')+(list.length>8?'<div class="tiny muted mt8">…等共 '+list.length+' 题</div>':'')+
    '<div class="row gap8 mt12"><button class="btn primary" id="startDrill">开始加练</button></div></div>';
  var b=resultHost.querySelector('#startDrill'); if(b) b.onclick=function(){ startDrillList(list); };
}
function refreshDrillHist(resultHost){
  var w=resultHost&&resultHost.closest('.view'); if(!w) return;
  renderAiHistory(w.querySelector('#aiHist'), 'drill', w, function(){ mountAiDrill(w); });
}
function generateDrill(types, count, diff, resultHost){
  var byWrong = diff==='wrong';
  var per={}, idx=0;
  for(var k=0;k<count;k++){ var t=types[idx%types.length]; per[t]=(per[t]||0)+1; idx++; }
  var reqText = types.map(function(t){ return TYPE_NAME[t]+' '+per[t]+' 题'; }).join('、');
  var pool=buildWeakPool();
  function done(list){ showDrillInline(resultHost, list); refreshDrillHist(resultHost); }
  if(!pool){
    /* 无错题 → 无薄弱点可分析，直接本地随机抽题（不发送任何数据给 AI） */
    var fb=drillFallback(byWrong, types, count);
    if(!wrongList().length) toast('暂无错题记录，已直接随机抽题（未调用 AI）');
    done(fb); return;
  }
  var prompt = buildDrillPrompt(buildWeakPoints(), reqText, count, byWrong, pool);
  if(resultHost) resultHost.innerHTML='<div class="ai-box"><div class="ai-sec"><span class="spinner"></span> AI 正在组卷<span class="dots"></span></div></div>';
  var timeout=new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('AI 选题超时（>25s），已回退随机抽题')); }, 25000); });
  Promise.race([llmCall(prompt, {tag:'智能加练'}), timeout]).then(function(txt){
    var arr=parseAIJSON(txt);
    var list=normalizeDrill(arr, count, types);
    if(!list.length) list=drillFallback(byWrong, types, count);
    done(list);
  }).catch(function(e){
    var list=drillFallback(byWrong, types, count);
    toast('AI 选题失败，已回退随机：'+(e.message||e)); done(list);
  });
}
function openSmartDrill(){ go('ai_drill'); }

/* ---------- 功能：通过率预测 ---------- */
function collectExamReadiness(){
  var ws=wrongList(), now=Date.now(), week=now-7*86400000;
  var recentWrong=0, unmastered=0, due=dueList().length;
  var byType={};
  AppState.stats.forEach(function(s){
    if(s.lastWrongTime && s.lastWrongTime>=week) recentWrong++;
    if(s.mastered) return;
    var q=AppState.qMap.get(s.qid); if(!q) return;
    unmastered++;
    var t=byType[q.type]||{n:0,ok:0}; t.n+=s.totalCount; t.ok+=s.correctCount; byType[q.type]=t;
  });
  var typeAcc=Object.keys(byType).map(function(t){
    var b=byType[t];
    return {type:t, name:TYPE_NAME[t]||t, total:b.n, correct:b.ok, acc:b.n? Math.round(b.ok/b.n*100):0};
  });
  var lastExam=AppState.exams[0]||null;
  return {
    totalWrong: ws.length,
    recentWrong7d: recentWrong,
    unmastered: unmastered,
    dueCount: due,
    dueRate: unmastered? Math.round(due/unmastered*100):0,
    typeAcc: typeAcc,
    lastExam: lastExam? {score:lastExam.score, accuracy:Math.round(lastExam.accuracy*100), total:lastExam.total, agoDays:Math.round((now-lastExam.date)/86400000)} : null
  };
}
function buildPassRatePrompt(d){
  return '你是一名资深铁路考试培训顾问。请基于以下学习数据，预测用户通过正式考试的可能性，并给出详细的改进计划。\n\n'+
    '【学习数据】\n'+JSON.stringify(d)+'\n\n'+
    '【要求】\n1. 预测通过率（0-100 的整数百分比）与置信度（高/中/低）\n2. 给出至少 3 条详细改进建议\n'+
    '3. 若预测通过率低于 60%，额外给出一个可执行的冲刺计划（未来 1-2 周，每天复习内容与目标）\n'+
    '4. 输出为 JSON：{ "passRate": 数字, "confidence": "高|中|低", "reason": "一句话判断依据", "suggestions": ["建议1","建议2","建议3", ...], "sprint": { "title": "冲刺计划标题", "plan": ["第1天：…", "第2天：…"] } }\n'+
    '注意：只输出 JSON，不要其他内容。suggestions 至少 3 条，总字数 350 字以内。';
}
function renderPassRateReport(json, d){
  var rate=clamp(Math.round(Number(json.passRate)||0),0,100);
  var conf=String(json.confidence||'中');
  var confCls = conf.indexOf('高')>=0?'hi':(conf.indexOf('低')>=0?'lo':'mid');
  var last=d.lastExam;
  var gap = last? Math.max(0, 60-last.score) : null;
  var gapTxt = gap==null? '暂无模考成绩，建议先完成一次模拟考试校准' :
    (gap===0? '最近一次模考已过 60 分及格线，保持状态！' : '距离 60 分及格线还差 <b>'+gap+'</b> 分（最近模考 '+last.score+' 分）');
  var h='<div class="pass-hero">'+
      '<div class="pass-num">'+rate+'<small>%</small></div>'+
      '<div class="pass-meta">'+
        '<div><span class="conf '+confCls+'">置信度 · '+esc(conf)+'</span> <span class="tiny muted">'+esc(json.reason||'')+'</span></div>'+
        '<div class="pass-track"><div class="pass-fill" style="width:'+rate+'%"></div></div>'+
        '<div class="tiny muted mt4">'+gapTxt+'</div>'+
      '</div></div>';
  var sg=Array.isArray(json.suggestions)? json.suggestions:[];
  if(sg.length){
    h+='<div class="ai-sec"><h3 class="rh">💡 改进建议</h3>';
    sg.forEach(function(x){ h+='<div class="suggest">'+esc(x)+'</div>'; });
    h+='</div>';

/* ---------- 功能：学习周报 ---------- */
function weekRange(offset){
  /* offset=0 本周（周一为起点）；返回 [startTs, endTs) */
  var now=new Date(); now.setHours(0,0,0,0);
  now.setDate(now.getDate()-((now.getDay()+6)%7) - offset*7);
  return [now.getTime(), now.getTime()+7*86400000];
}
function collectWeekData(){
  function agg(offset){
    var r=weekRange(offset), done=0, wrong=0, days=[];
    for(var i=0;i<7;i++){
      var d=new Date(r[0]+i*86400000), k=dateKey(d), x=AppState.dailyHist[k];
      days.push({date:k, done:x?x.done:0, wrong:x?x.wrong:0});
      done+=x?x.done:0; wrong+=x?x.wrong:0;
    }
    var newWeak=0;
    AppState.stats.forEach(function(s){ if(s.lastWrongTime && s.lastWrongTime>=r[0] && s.lastWrongTime<r[1]) newWeak++; });
    var exams=AppState.exams.filter(function(e){ return e.date>=r[0] && e.date<r[1]; });
    var examAvg=exams.length? Math.round(exams.reduce(function(a,e){ return a+e.score; },0)/exams.length) : null;
    return { days:days, done:done, wrong:wrong,
      acc: done? Math.round((done-wrong)/done*100) : 0,
      newWeak:newWeak, examCount:exams.length, examAvg:examAvg };
  }
  return { thisWeek:agg(0), lastWeek:agg(1),
    dueNow:dueList().length, totalWrong:wrongList().length, mastered:masteredCount() };
}
function buildWeeklyPrompt(d){
  return '你是一名学习分析专家。请根据以下学习数据生成本周学习周报。\n\n'+
    '【本周数据】\n'+JSON.stringify(d.thisWeek)+'\n\n'+
    '【上周对比】\n'+JSON.stringify(d.lastWeek)+'\n\n'+
    '【当前状态】\n'+JSON.stringify({当前错题:d.totalWrong, 今日到期复习:d.dueNow, 已掌握:d.mastered})+'\n\n'+
    '【要求】\n1. summary：本周整体总结（含数据对比，200 字以内）\n2. progress：学习进步亮点，至少 2 条（如正确率提升、刷题量增加）\n3. suggestions：改进建议，至少 3 条（具体可执行）\n'+
    '4. 输出 JSON：{ "summary": "...", "progress": ["亮点1","亮点2"], "suggestions": ["建议1","建议2","建议3"] }\n'+
    '注意：只输出 JSON。若本周无学习记录，summary 请温和提醒并给出开始计划。';
}

    '用户问：「'+v+'」\n请基于已有讲解，用通俗语言回答用户的追问。不要重复已讲过的内容。保持简洁，200 字以内。';

function renderConvo(listEl, turns){
  listEl.innerHTML = turns.map(function(t){
    return '<div class="conv conv-u"><b>你：</b>'+esc(t.user)+'</div><div class="conv conv-a">'+nl2br(t.assistant)+'</div>';
  }).join('');
  listEl.scrollTop = listEl.scrollHeight;
}
function attachFollowUp(slot, q, userAnswer, txt){
  if(!llmConfigured()) return;
  var cid=q.id;
  if(!aiConvoMap[cid]) aiConvoMap[cid]={ q:q, userAnswer:userAnswer, explain:txt, turns:[] };
  else { aiConvoMap[cid].explain=txt; aiConvoMap[cid].userAnswer=userAnswer; }
  var box=document.createElement('div'); box.className='ai-sec ai-followup';
  box.innerHTML='<div class="row between"><div class="strong small">💬 继续追问</div><span class="tiny muted">基于本次讲解</span></div>'+
    '<div id="convoList" class="mt8"></div>'+
    '<div class="row gap8 mt8"><input class="input" id="followQ" placeholder="还有疑问？回车发送…"><button class="btn sm primary" id="followSend">发送</button></div>'+
    '<div class="tiny muted mt4">Enter 发送 · Esc 清空</div>';
  slot.appendChild(box);
  var listEl=box.querySelector('#convoList'), input=box.querySelector('#followQ'), send=box.querySelector('#followSend');
  renderConvo(listEl, aiConvoMap[cid].turns);
  function doSend(){
    var v=input.value.trim(); if(!v) return;
    input.value=''; input.disabled=true; send.disabled=true;
    var ctx=aiConvoMap[cid];
    var sp=document.createElement('div'); sp.className='conv conv-a';
    sp.innerHTML='<span class="spinner"></span> ';
    var spTxt=document.createElement('span'); sp.appendChild(spTxt);
    listEl.appendChild(sp); listEl.scrollTop=listEl.scrollHeight;
    var typer=makeTyper(spTxt);
    var ctrl=(typeof AbortController!=='undefined')? new AbortController() : null;
    llmCall(buildFollowPrompt(ctx, v), {tag:'追问', signal:ctrl?ctrl.signal:undefined, onChunk:function(full){
      typer.push(full.slice(typer.text().length));
      listEl.scrollTop=listEl.scrollHeight;
    }}).then(function(r){
      typer.end(); sp.remove();
      ctx.turns.push({user:v, assistant:r}); renderConvo(listEl, ctx.turns);
      input.disabled=false; send.disabled=false; input.focus();
    }).catch(function(e){
      typer.end(); sp.remove();
      var err=document.createElement('div'); err.className='tiny'; err.style.color='var(--red)';
      err.textContent=(e&&e.name==='AbortError')?'已停止本次回答。':('追问失败：'+(e.message||e));
      listEl.appendChild(err); input.disabled=false; send.disabled=false; input.focus();
    });
  }
  send.onclick=doSend;
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); doSend(); }
    else if(e.key==='Escape'){ input.value=''; input.blur(); }
  });
}

 * 22. 全局键盘快捷键

document.addEventListener('keydown', function(e){
  var ae=document.activeElement, tag=ae?ae.tagName:'';
  var typing = (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT');
  /* 背题模式（独立二级页面） */
  if(CardMode && AppState.view==='card'){
    if(e.key===' '){ e.preventDefault(); tapCard(); return; }
    if(e.key==='ArrowRight'){ CardMode.i=(CardMode.i+1)%CardMode.list.length; CardMode.phase='q'; drawCard(); return; }
    if(e.key==='ArrowLeft'){ CardMode.i=(CardMode.i-1+CardMode.list.length)%CardMode.list.length; CardMode.phase='q'; drawCard(); return; }
    if(e.key==='1'){ var q=CardMode.list[CardMode.i]; updateStat(q.id,true,5); dailyAdd(1); toast('已记录掌握'); CardMode.i=(CardMode.i+1)%CardMode.list.length; CardMode.phase='q'; drawCard(); return; }
  }
  if($('#modalRoot').children.length && e.key==='Escape'){
    var lastM=$('#modalRoot').lastElementChild;
    if(lastM) Modal.close(lastM);   /* 触发 onClose（背题模式会收起跳转面板） */
    CardMode=null;
    return;
  }
  var s=AppState.session;
  if(!s || !s.active || s.finished) return;
  if(e.key==='Escape') return;
  if(typing && e.key!=='Enter') return;
  var q=curQ(s);
  /* [OPT-03] 键盘作答：模考允许反复修改并即时落盘+前进；练习已判题后保持锁定 */
  var kbExam = s.mode==='exam';
  if((/^[1-9]$/.test(e.key) || /^[a-j]$/i.test(e.key)) && (kbExam || !s.results[s.idx]) && (q.type==='single'||q.type==='multiple')){
    var idx = /^[1-9]$/.test(e.key) ? parseInt(e.key,10)-1 : (e.key.toLowerCase().charCodeAt(0)-97);
    var k=String.fromCharCode(65+idx);
    if(q.options[idx]){
      if(q.type==='single') s.answers[s.idx]=k;
      else{
        var cur=String(s.answers[s.idx]||'');
        if(cur.indexOf(k)>=0) cur=cur.split('').filter(function(c){ return c!==k; }).join('');
        else cur=(cur+k).split('').sort().join('');
        s.answers[s.idx]=cur;
      }
      buzz(8);
      if(kbExam) examAnswerAndAdvance(s); else refreshSessionArea();
      e.preventDefault(); return;
    }
  }
  if(e.key==='Enter'){
    /* [OPT-05] 简答作答（textarea）中允许回车换行，不触发提交/翻题 */
    if(typing && ae && ae.tagName==='TEXTAREA') return;
    e.preventDefault();
    /* [OPT-04] 模考：回车=落盘并进入下一题（末题则交卷），与按钮行为一致 */
    if(s.mode==='exam'){ nextQuestion(s); return; }
    if(!s.results[s.idx]) submitCurrent(s);
    else nextQuestion(s);
    return;
  }
  if(e.key===' '){
    /* 空格的语义取舍：仅在内容不超出一屏（无需滚动）时才作为「下一题」；
       否则放行空格用于页面滚动，避免读长题干/解析时误触跳题（经典反人类交互） */
    var docEl=document.documentElement;
    var canScroll = docEl.scrollHeight > window.innerHeight + 4;
    if(canScroll) return;     /* 内容超出一屏：让浏览器默认滚动 */
    e.preventDefault();
    nextQuestion(s);          /* 空格＝下一题／跳过，未作答也可跳 */
    return;
  }
  if(e.key==='ArrowLeft'){ prevQuestion(s); }
  if(e.key==='ArrowRight'){ nextQuestion(s); }
});

var JP=null;
function practicePadCfg(s){
  /* 题卡按题型分组（按题型在试卷中首次出现顺序排列），组内保持题号顺序，
     便于跳题时一眼看清「填空题 / 单选题 / 多选题 …」各有哪些题 */
  var seen={}, order=[], map={};
  s.list.forEach(function(q,i){
    var t=q.type;
    if(!seen[t]){ seen[t]=true; order.push(t); map[t]=[]; }
    map[t].push(i);
  });
  var groups = order.map(function(t){ return {name: TYPE_NAME[t]||t, idx: map[t]}; });
  return {
    count: s.list.length,
    groups: groups,
    getIdx: function(){ return s.idx; },
    onJump: function(i){ commitExamCurrent(s); s.idx=i; saveProgress(s); refreshSessionArea(); },
    /* 题卡网格状态：模拟考试只区分「已做/未做」，不暴露对错，遵守考试规则 */
    status: function(){
      return s.list.map(function(q, i){
        if(i===s.idx) return 'cur';
        if(s.mode==='exam') return hasAnswer(q, s.answers[i]) ? 'done' : 'todo';
        var r=s.results[i];
        if(r) return r.correct ? 'correct' : 'wrong';
        if(hasAnswer(q, s.answers[i])) return 'done';
        return 'todo';
      });
    }
  };
}

      range=el.querySelector('#jpRange'), num=el.querySelector('#jpNum'),

  JP={el:el, panel:panel, fab:fab, big:big, tot:tot, range:range, num:num, grid:grid, slider:slider, legend:legend, ctx:null, open:false, cfg:null};
  fab.onclick=function(){ JP.open=true; el.classList.add('open'); };
  el.querySelector('#jpX').onclick=function(){ JP.open=false; el.classList.remove('open'); };
  range.addEventListener('input', function(){ big.textContent=range.value; });
  function jump(){
    if(!JP.cfg) return;
    var v=Math.max(1, Math.min(JP.cfg.count, parseInt(range.value,10)||1));
    JP.cfg.onJump(v-1);
  }
  el.querySelector('#jpGo').onclick=jump;
  el.querySelector('#jpPrev').onclick=function(){ range.value=Math.max(1, parseInt(range.value,10)-1); big.textContent=range.value; jump(); };
  el.querySelector('#jpNext').onclick=function(){ range.value=Math.min(JP.cfg?JP.cfg.count:1, parseInt(range.value,10)+1); big.textContent=range.value; jump(); };
  return JP;

function showJumpPad(ctx, cfg){
  jumpPadEl();
  var changed = JP.ctx!==ctx;
  JP.ctx=ctx; JP.cfg=cfg;
  JP.el.classList.add('show');
  JP.range.max = String(cfg.count);
  if(changed){ JP.open=false; JP.el.classList.remove('open'); }
  syncJumpPad();
}

function syncJumpPad(){
  if(!JP || !JP.el.classList.contains('show') || !JP.cfg) return;
  var i = JP.cfg.getIdx();
  JP.num.textContent = (i+1);
  JP.range.value = String(i+1);
  JP.big.textContent = String(i+1);
  JP.tot.textContent = '共 '+JP.cfg.count+' 题';
  /* 题卡网格：按题型分组渲染每题号，并根据 status() 着色（模拟考试只显示已做/未做） */
  if(JP.cfg.status){
    JP.slider.style.display='none'; JP.grid.style.display='flex'; JP.legend.style.display='flex';
    var st=JP.cfg.status();
    var showCW = st.indexOf('correct')>=0 || st.indexOf('wrong')>=0;
    JP.el.querySelector('#jpLegCW').style.display = showCW?'inline-flex':'none';
    JP.el.querySelector('#jpLegCW2').style.display = showCW?'inline-flex':'none';
    /* 仅在题型分组结构变化时重建网格（避免每次刷新重建丢失交互/闪烁） */
    var sig = JP.cfg.groups.map(function(g){ return g.name+'|'+g.idx.length; }).join('#');
    if(JP.grid.getAttribute('data-sig')!==sig){
      JP.grid.setAttribute('data-sig', sig);
      JP.grid.innerHTML = JP.cfg.groups.map(function(g){
        return '<div class="jp-group"><div class="jp-glabel">'+esc(g.name)+'</div><div class="jp-gcells">'+
          g.idx.map(function(k){ return '<div class="jp-cell" data-j="'+k+'">'+(k+1)+'</div>'; }).join('')+
          '</div></div>';
      }).join('');
      JP.grid.querySelectorAll('[data-j]').forEach(function(c){ c.onclick=function(){ JP.cfg.onJump(parseInt(c.getAttribute('data-j'),10)); }; });
    }
    var cells = JP.grid.querySelectorAll('.jp-cell');
    for(var k=0;k<st.length;k++){
      var c=cells[k]; if(!c) continue;
      c.className='jp-cell'+(st[k]==='cur'?' cur':(st[k]==='done'?' done':(st[k]==='correct'?' correct':(st[k]==='wrong'?' wrong':''))));
    }
  } else {
    JP.slider.style.display='block'; JP.grid.style.display='none'; JP.legend.style.display='none';
  }
}

// ===== PWA：注册 Service Worker + 桌面安装 =====
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  // 相对路径注册，scope 默认与脚本同目录
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // 捕获安装提示，可在设置中触发
  window.addEventListener('beforeinstallprompt', (e)=>{
    try{ e.preventDefault(); }catch(_){}
    window.__deferredInstall = e;
    document.dispatchEvent(new CustomEvent('pwa-installable'));
  });
  window.addEventListener('appinstalled', ()=>{
    window.__deferredInstall = null;
    document.dispatchEvent(new CustomEvent('pwa-installed'));
  });
}
registerSW();

function aiSaveReport(rec){

  if(AppState.aiHist.reports.length>40) AppState.aiHist.reports.length=40;
  saveAiHist();
}
/* 可点击提示：后台生成完成后，即便窗口已关，点一下也能打开结果 */
function aiNotify(msg, onClick){
  var el=document.createElement('div'); el.className='toast'; el.innerHTML=msg; el.style.cursor='pointer';
  el.onclick=function(){ try{ onClick&&onClick(); }catch(e){} el.remove(); };
  var root=$('#toastRoot'); if(root) root.appendChild(el);
  setTimeout(function(){ if(el.parentNode){ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(function(){ el.remove(); },320);} }, 5400);
}
function openAiHistory(tab, focusId){
  var repCount=AppState.aiHist.reports.length;
  if(!repCount){ toast('还没有任何 AI 生成记录'); return; }
  var out=AppState.aiHist.reports.map(function(rec){
    return '<div class="ai-sec click" data-rep="'+rec.id+'" style="border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px">'+
      '<div class="row between"><div class="strong small">'+esc(rec.label)+'</div><span class="tiny muted">'+fmtAgo(rec.ts)+'</span></div>'+
      (rec.sub?'<div class="tiny muted mt4">'+esc(rec.sub)+'</div>':'')+'</div>';
  }).join('');
  Modal.open({ title:'📥 我的 AI 记录', sub:'后台生成的报告都留痕，关窗也不丢',
    body: '<div id="aiHistBody">'+out+'</div>',
    foot:'<button class="btn" data-close>关闭</button>',
    onMount:function(m){
      m.querySelectorAll('[data-rep]').forEach(function(el){ el.onclick=function(){ openReportDetail(el.getAttribute('data-rep')); }; });
    }
  });
  if(focusId){ openReportDetail(focusId); }
}

function openReportDetail(id){
  var rec=null; AppState.aiHist.reports.forEach(function(r){ if(r.id===id) rec=r; });
  if(!rec){ toast('记录已不存在'); return; }
  if(rec.list && rec.list.length){
    var qs=rec.list.map(function(x){ return AppState.qMap.get(x.id); }).filter(Boolean);
    var body='<div class="card" style="padding:14px">'+
      (qs.length? qs.slice(0,8).map(function(q){ return '<div class="weak-item"><span>'+esc(qTitle(q).slice(0,52))+'</span></div>'; }).join('')
                : '<div class="tiny muted">题目已不在当前题库</div>')+
      (qs.length>8?'<div class="tiny muted mt8">…等共 '+qs.length+' 题</div>':'')+'</div>';
    Modal.open({ title:rec.label, sub:rec.sub||'', body:body,
      foot:'<button class="btn" data-close>关闭</button>'+(qs.length?'<button class="btn primary" id="repStart">开始加练</button>':''),
      onMount:function(m){ var b=m.querySelector('#repStart'); if(b) b.onclick=function(){ Modal.close(m); startSession({view:'practice', mode:'practice', list:qs, title:rec.label}); }; } });
    return;
  }
  Modal.open({ title:rec.label, sub:rec.sub||(fmtAgo(rec.ts)),
    body:'<div class="ai-report">'+rec.html+'</div>',
    foot:'<button class="btn" data-close>关闭</button>' });
}
/* AI 报告类功能统一收尾：渲染进窗口（若仍开着）+ 写入历史 + 可点击通知 */
function aiReportDone(opts){
  aiSaveReport({ id:'rep_'+Date.now(), label:opts.label, sub:opts.sub||'', html:opts.html, ts:Date.now(), raw:opts.raw||'' });
  if(opts.m && opts.m.isConnected && opts.host) opts.host.innerHTML='<div class="ai-box">'+opts.html+'</div>';
  if(typeof opts.after==='function'){ try{ opts.after(); }catch(e){} }
  aiNotify('✅ '+opts.label+' 已完成，点此查看', function(){ openAiHistory('reports'); });
}

/* ---------- C：错题根因归纳 ---------- */
function buildRootCausePrompt(data){
  return '你是一名资深铁路考试辅导老师。下面是学员的错题（仅题干与错误次数，不含答案）。\n\n'+
    '【错题】\n'+JSON.stringify(data)+'\n\n'+
    '【要求】\n1. 提炼这些错题的【共同根因】：用一句话点破最底层的知识混淆或盲区（不要逐题复述，要归纳）；\n'+
    '2. 给出【攻克方法】1-2 条可立即执行；\n3. 列出【优先补强的 3 个知识点】。\n'+
    '输出 JSON：{"rootCause":"...","fix":"...","topics":["...","...","..."],"summary":"一句话总结"}\n总字数≤300。';
}
function renderRootCause(txt){
  var json=null; try{ var m=String(txt).match(/\{[\s\S]*\}/); if(m) json=JSON.parse(m[0]); }catch(e){}
  if(!json) return '<div class="ai-sec">'+nl2br(String(txt).slice(0,600))+'</div>';
  var h='';
  if(json.rootCause) h+='<div class="ai-sec"><h3 class="rh">🎯 共同根因</h3><div class="strong">'+nl2br(json.rootCause)+'</div></div>';
  if(json.fix) h+='<div class="ai-sec"><h3 class="rh">🛠 攻克方法</h3><div>'+nl2br(json.fix)+'</div></div>';
  if(Array.isArray(json.topics)&&json.topics.length) h+='<div class="ai-sec"><h3 class="rh">📌 优先补强</h3>'+json.topics.map(function(t){return '<div class="weak-item"><span>'+esc(t)+'</span></div>';}).join('')+'</div>';
  if(json.summary) h+='<div class="ai-sec"><h3 class="rh">💡 一句话</h3><div class="tiny">'+nl2br(json.summary)+'</div></div>';
  return h||'<div class="ai-sec">'+nl2br(String(txt).slice(0,600))+'</div>';
}
function openRootCause(){ go('ai_rootcause'); }

/* ---------- D：概念辅导（讲知识非讲题） ---------- */
function buildTutorPrompt(q){

    '学员问：「'+q+'」\n\n'+

    '语言口语化、条理清晰，字数 200-400 字。';
}

/* ---------- F：主观题 AI 精批（复用 SYS_PROMPT_GRADE，返回分数+理由；不改动既有 gradeShortWithAI） ---------- */
function aiGradeShortDetailed(q, userAns){
  var msg='【题目】'+qTitle(q)+'\n'+
    (q.options&&q.options.length?'【选项】'+optionsText(q)+'\n':'')+
    '【标准答案】'+answerDisplay(q)+'\n'+
    '【学生作答】'+String(userAns||'（空）')+'\n\n请严格按 JSON 输出评分结果。';
  return llmCall(SYS_PROMPT_GRADE+'\n\n'+msg, {tag:'简答精批'}).then(function(t){
    var txt=String(t||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'');
    var score=NaN, reason='';
    try{ var m=txt.match(/\{[\s\S]*\}/); if(m){ var o=JSON.parse(m[0]); if(typeof o.score==='number'&&isFinite(o.score)) score=o.score; reason=String(o.reason||''); } }catch(e){}
    if(isNaN(score)){ var mm=txt.match(/(-?\d{1,3})\s*分?/); if(mm) score=parseInt(mm[1],10); }
    if(isNaN(score)) score=60;
    return { score: clamp(Math.round(score),0,100), reason: reason };
  });
}
function aiGradeShort(q, ans, btn){
  if(btn) btn.disabled=true;
  var slot=btn? btn.parentNode.querySelector('#aiGradeSlot') : null;
  if(slot) slot.textContent='评分中…';
  aiGradeShortDetailed(q, ans).then(function(r){
    if(btn) btn.disabled=false;
    if(slot) slot.innerHTML='AI 精批：<b>'+r.score+' 分</b>'+(r.reason?' · '+esc(r.reason):'');
  }).catch(function(e){
    if(btn) btn.disabled=false;
    if(slot) slot.innerHTML='<span style="color:var(--red)">精批失败：'+(e.message||e)+'</span>';
  });
}
