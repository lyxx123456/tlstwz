<!--
[OPT] index.html 代码审计后定点修复版
生成时间：由审计工具自动补丁生成；功能与原文件等价，仅在关键缺陷处做了行为修复。
修复项：OPT-01…OPT-11，详见文末变更摘要清单。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷题">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="刷题">
<meta name="description" content="铁路安全与铁路信息考试智能刷题与辅助记忆应用">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>刷题 · 铁路安全</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAFAFA;--card:#FFFFFF;--text:#1D1D1F;--sub:#6E6E73;--muted:#9A9AA0;
  --blue:#007AFF;--blue-soft:rgba(0,122,255,.08);--blue-soft2:rgba(0,122,255,.14);
  --green:#34C759;--green-soft:rgba(52,199,89,.10);
  --red:#FF3B30;--red-soft:rgba(255,59,48,.08);
  --orange:#FF9500;--orange-soft:rgba(255,149,0,.12);
  --border:#EDEDF0;--border2:#E5E5EA;
  --shadow:0 2px 12px rgba(0,0,0,.04);
  --shadow-lg:0 16px 48px rgba(0,0,0,.12);
  --r:12px;--r2:24px;--r3:24px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
::selection{background:var(--blue-soft2)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#DFDFE4;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:228px;flex:0 0 228px;height:100vh;position:sticky;top:0;padding:22px 14px 16px;border-right:1px solid var(--border);background:rgba(255,255,255,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 0}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#0A84FF,#007AFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;box-shadow:0 4px 14px rgba(0,122,255,.28);letter-spacing:-.5px}
.brand-t{font-weight:650;font-size:15.5px;letter-spacing:-.2px;line-height:1.25}
.brand-s{font-size:11.5px;color:var(--muted);letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--sub);font-size:14.5px;transition:background .16s,color .16s;user-select:none}
.nav-item:hover{background:rgba(0,0,0,.035);color:var(--text)}
.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav-ico{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.side-foot{border-top:1px solid var(--border);padding-top:12px}
.side-mini{font-size:11.5px;color:var(--muted);line-height:1.7;padding:0 10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 26px;position:sticky;top:0;z-index:30;background:rgba(250,250,250,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.tb-title{font-size:17px;font-weight:650;letter-spacing:-.3px}
.tb-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:24px 26px 40px;max-width:940px;width:100%;margin:0 auto;flex:1}
.tabbar{display:none}

/* ============ 通用元素 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border2);background:#fff;color:var(--text);cursor:pointer;font-size:14px;font-weight:500;transition:.16s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.07);border-color:#D4D4D9;background:#FCFCFD}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.22)}
.btn.primary:hover{background:#0A84FF;border-color:#0A84FF;box-shadow:0 6px 18px rgba(0,122,255,.32);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.danger{color:var(--red);border-color:rgba(255,59,48,.28);background:rgba(255,59,48,.04)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.lg{height:46px;padding:0 22px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.card{background:var(--card);border:1px solid rgba(0,0,0,.03);border-radius:var(--r2);box-shadow:var(--shadow);padding:18px}
.card.tight{padding:14px}
.card.click{cursor:pointer;transition:.18s}
.card.click:hover{box-shadow:0 6px 22px rgba(0,0,0,.07);transform:translateY(-1px)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* 答题操作按钮行：允许换行；.btn-sp 弹性占位把右侧按钮推到行尾（等价于 between） */
.btn-row{flex-wrap:wrap}
.btn-sp{flex:1 1 0;min-width:0}
.center{display:flex;align-items:center;justify-content:center}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.muted{color:var(--muted)}
.sub{color:var(--sub)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.strong{font-weight:650}
.h1{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.3}
.h2{font-size:19px;font-weight:680;letter-spacing:-.35px}
.h3{font-size:15.5px;font-weight:650;letter-spacing:-.2px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ell3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:1px;background:var(--border);margin:14px 0}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:#F2F2F7;color:var(--sub)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:#1E9E45}
.badge.orange{background:var(--orange-soft);color:#C77700}
.kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;font-size:11px;color:var(--sub);background:#fff}
.stat{background:var(--card);border:1px solid rgba(0,0,0,.03);border-radius:var(--r2);box-shadow:var(--shadow);padding:16px 16px 14px}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--border2);background:#fff;font-size:13.5px;color:var(--sub);cursor:pointer;transition:.16s;user-select:none}
.chip:hover{border-color:#D4D4D9}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.progress{height:6px;border-radius:6px;background:#EDEDF0;overflow:hidden}
.progress>div{height:100%;background:var(--blue);border-radius:6px;transition:width .3s ease}
.progress.thin{height:4px}
.seg{display:inline-flex;background:#F0F0F3;border-radius:10px;padding:3px;gap:2px}
.seg-item{flex:1;padding:6px 14px;border-radius:8px;font-size:13.5px;color:var(--sub);cursor:pointer;text-align:center;transition:.16s;user-select:none;white-space:nowrap}
.seg-item.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.input,.ta{width:100%;border:1px solid var(--border2);border-radius:10px;padding:9px 12px;background:#fff;outline:none;transition:.16s;font-size:14px}
.input:focus,.ta:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.ta{min-height:120px;resize:vertical;line-height:1.7}
.field{margin-bottom:14px}
.label{font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:550}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:0 0 46px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .knob{position:absolute;inset:0;background:#E5E5EA;border-radius:28px;cursor:pointer;transition:.22s}
.switch .knob:before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch input:checked + .knob{background:var(--blue)}
.switch input:checked + .knob:before{transform:translateX(18px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#E5E5EA;border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.06);box-shadow:0 2px 6px rgba(0,0,0,.18);margin-top:-8px;cursor:pointer}
input[type=range]::-moz-range-track{height:4px;background:#E5E5EA;border-radius:4px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer}

/* ============ 空状态 ============ */
.empty{text-align:center;padding:56px 20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-ico{width:68px;height:68px;border-radius:20px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
.empty h3{margin:0;font-size:18px;font-weight:650;letter-spacing:-.3px}
.empty p{margin:0;color:var(--muted);font-size:13.5px;max-width:420px;line-height:1.7}

/* ============ 题目 / 选项 ============ */
.qwrap{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtext{font-size:17px;line-height:1.72;letter-spacing:-.1px;font-weight:520;white-space:pre-wrap;word-break:break-word}
.qtext .blank{color:var(--blue);border-bottom:1.5px solid var(--blue-soft2);padding:0 10px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border:1px solid var(--border2);border-radius:var(--r);background:#fff;cursor:pointer;transition:.16s;user-select:none;margin-bottom:9px;line-height:1.6}
.opt:hover{border-color:#D2D2D8;background:#FCFCFD}
.opt .opt-key{flex:0 0 24px;height:24px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:650;color:var(--sub);background:#fff;transition:.16s;margin-top:1px}
.opt .opt-text{flex:1;min-width:0}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .opt-key{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .opt-key{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .opt-key{background:var(--red);border-color:var(--red);color:#fff}
.opt.locked{cursor:default}
.opt.disabled{opacity:.55}
.judge-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge-btn{padding:20px;border-radius:var(--r);border:1px solid var(--border2);background:#fff;text-align:center;font-size:16px;font-weight:600;cursor:pointer;transition:.16s}
.judge-btn.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.judge-btn.correct{border-color:var(--green);background:var(--green-soft);color:#1E9E45}
.judge-btn.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fill-blank{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.fill-idx{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#F2F2F7;color:var(--sub);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:650}
.fill-idx.ok{background:var(--green-soft);color:#1E9E45}
.fill-idx.no{background:var(--red-soft);color:var(--red)}
.fb{border-radius:var(--r);padding:14px 16px;margin-top:12px;border:1px solid transparent;animation:fadeUp .26s ease}
.fb.good{background:var(--green-soft);border-color:rgba(52,199,89,.22)}
.fb.bad{background:var(--red-soft);border-color:rgba(255,59,48,.2)}
.fb-row{display:flex;gap:10px;align-items:flex-start;margin-top:6px;font-size:14px;line-height:1.65}
.fb-label{flex:0 0 62px;color:var(--sub);font-size:13px;padding-top:1px}
.fb-val{flex:1;min-width:0;word-break:break-word}
.analysis-box{background:#F7F7F9;border-radius:var(--r);padding:13px 15px;margin-top:10px;font-size:14px;line-height:1.75;color:#3A3A3C;white-space:pre-wrap;word-break:break-word}
.ai-box{margin-top:12px;border:1px solid var(--blue-soft2);border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,rgba(0,122,255,.045),rgba(0,122,255,.015))}
.ai-sec{padding:12px 15px;border-bottom:1px solid rgba(0,122,255,.10);font-size:14px;line-height:1.75}
.ai-sec:last-child{border-bottom:none}
.ai-sec h4{margin:0 0 4px;font-size:12.5px;color:var(--blue);font-weight:650;letter-spacing:.2px}
.ai-sec.mnemo{background:rgba(255,149,0,.06)}
.ai-sec.mnemo h4{color:#C77700}
.dots:after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}
.spinner{width:16px;height:16px;border:2px solid rgba(0,122,255,.22);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .32s ease}

/* ============ 虚拟列表 ============ */
.vlist{position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.vlist-inner{position:relative;width:100%}
.vitem{position:absolute;top:0;left:0;right:0;padding:0 2px 8px}
.qitem{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;cursor:pointer;transition:.15s}
.qitem:hover{border-color:#DCDCE2;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.qitem-idx{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;min-width:34px}
.qitem-main{flex:1;min-width:0}
.qitem-title{font-size:14px;line-height:1.6;word-break:break-word}

/* ============ 闪卡 ============ */
.flipcard{perspective:1400px;height:340px;cursor:pointer}
.flipcard-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flipcard.flipped .flipcard-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid rgba(0,0,0,.03);border-radius:var(--r3);box-shadow:var(--shadow);padding:26px;overflow:auto;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);background:#FCFCFE}
  .face .fq{font-size:18px;line-height:1.75;flex:1;word-break:break-word;white-space:pre-wrap}
  .face .fa{font-size:16px;font-weight:650;color:var(--blue);line-height:1.7}
  .card-answer{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);animation:cardReveal .28s ease}
  @keyframes cardReveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ============ 弹层 ============ */
.mask{position:fixed;inset:0;background:rgba(20,20,22,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.mask.bottom{align-items:flex-end;padding:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;border-radius:var(--r3);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;animation:pop .26s cubic-bezier(.3,1.2,.5,1);overflow:hidden}
.mask.bottom .sheet{max-width:680px;border-radius:22px 22px 0 0;max-height:92vh}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.96)}60%{opacity:1;transform:translateY(-3px) scale(1.012)}100%{opacity:1;transform:none}}
.sheet-head{padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border)}
.sheet-head h3{margin:0;font-size:17px;font-weight:650;letter-spacing:-.3px}
.sheet-head .xclose{margin-left:auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:17px;background:#F2F2F7;flex:0 0 28px}
.sheet-head .xclose:hover{background:#E8E8ED;color:var(--text)}
.sheet-body{padding:18px 20px;overflow:auto;flex:1}
.sheet-foot{padding:12px 20px 18px;display:flex;gap:10px;border-top:1px solid var(--border)}
.sheet-foot .btn{flex:1}
.toast-root{position:fixed;left:0;right:0;bottom:28px;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px}
.toast{background:rgba(29,29,31,.92);color:#fff;padding:9px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .24s ease;max-width:520px;text-align:center;backdrop-filter:blur(10px)}
@keyframes toastIn{0%{opacity:0;transform:translateY(14px) scale(.96)}60%{opacity:1;transform:translateY(-2px) scale(1)}100%{opacity:1;transform:none}}

/* ============ 视图动画 / 翻页淡入淡出 ============ */
.view{animation:viewIn .32s cubic-bezier(.25,.8,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view-leaving{animation:viewOut .18s ease forwards;pointer-events:none}
@keyframes viewOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px)}}
.list-enter{animation:viewIn .34s ease both}
/* 翻题滑入（上一题 / 下一题） */
.q-enter-r{animation:qEnterR .34s cubic-bezier(.25,.8,.3,1) both}
.q-enter-l{animation:qEnterL .34s cubic-bezier(.25,.8,.3,1) both}
@keyframes qEnterR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes qEnterL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
/* 选项选中弹跳 */
.opt.sel,.judge-btn.sel{animation:optPop .24s cubic-bezier(.3,1.3,.5,1)}
@keyframes optPop{0%{transform:scale(.97)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
/* 答对高亮弹入 */
.opt.correct,.judge-btn.correct,.fb.good{animation:popGood .42s cubic-bezier(.2,1.1,.4,1)}
@keyframes popGood{0%{transform:scale(.96)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
/* 答错抖动 */
.opt.wrong,.judge-btn.wrong,.fb.bad{animation:optShake .42s ease}
@keyframes optShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-6px)}38%{transform:translateX(6px)}58%{transform:translateX(-4px)}78%{transform:translateX(4px)}}
/* 弹窗关闭：遮罩淡出 + 面板缩回 */
.mask.closing{animation:maskOut .2s ease forwards}
.mask.closing .sheet{animation:sheetOut .2s cubic-bezier(.4,0,1,1) forwards}
@keyframes maskOut{from{opacity:1}to{opacity:0}}
@keyframes sheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(12px) scale(.97)}}
.mask.bottom.closing .sheet{animation:sheetBottomOut .22s ease forwards}
@keyframes sheetBottomOut{from{transform:translateY(0)}to{transform:translateY(100%)}}
/* 题卡 FAB 弹入 */
.jp.show .jp-fab{animation:fabIn .28s cubic-bezier(.3,1.3,.5,1)}
@keyframes fabIn{0%{opacity:0;transform:scale(0) rotate(-90deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
/* 交卷遮罩淡入 */
.exam-submitting{opacity:0;transition:opacity .22s ease}
.exam-submitting>div{animation:pop .3s cubic-bezier(.3,1.2,.5,1)}
/* 水波纹（点击反馈） */
.btn,.chip,.nav-item,.opt,.judge-btn,.seg-item,.qitem,.xclose,.jp-cell{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(10,102,255,.16);transform:scale(0);animation:ripple .55s ease-out;pointer-events:none;z-index:2}
html.dark .ripple{background:rgba(120,180,255,.24)}
@keyframes ripple{to{transform:scale(2.4);opacity:0}}
/* 按钮按压缩放（点击下沉） */
.btn:active,.chip:active,.nav-item:active,.opt:active,.judge-btn:active,.seg-item:active,.qitem:active,.card.click:active{transform:scale(.97)}

/* ============ 表格 ============ */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.tbl td{color:var(--sub)}
.tbl tr:last-child td{border-bottom:none}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .sidebar{display:none}
  .content{padding:16px 14px 110px;max-width:100%}
  .topbar{padding:0 14px;height:52px;flex-basis:52px}
  .tb-title{font-size:16.5px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10.5px;cursor:pointer;position:relative;transition:.15s}
  .tab.active{color:var(--blue)}
  .tab .ti{font-size:19px;line-height:1.1}
  .tab .tdot{position:absolute;top:2px;right:calc(50% - 18px);min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .h1{font-size:22px}
  .stat-num{font-size:22px}
  .mask{padding:0;align-items:flex-end}
  .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:92vh}
  .toast-root{bottom:88px}
  .face{padding:20px}
}
@media (max-width:400px){.g2{grid-template-columns:1fr}}
/* 手机端答题按钮：两列均分铺满屏宽，不溢出；落单的主按钮自动占满整行 */
@media (max-width:600px){
  .btn-row{gap:8px}
  .btn-row .btn{flex:1 1 calc(50% - 4px);min-width:calc(50% - 4px);padding:0 10px}
  .btn-row .btn-sp,.btn-row .kbd{display:none}
  .keysHint{display:none}
}
@media print{.sidebar,.tabbar,.topbar{display:none}}

/* ============ 题号跳转 FAB ============ */
.jp{position:fixed;z-index:300;right:20px;bottom:26px;display:none}
.jp.show{display:block}
.jp-fab{width:54px;height:54px;border:0;border-radius:50%;cursor:pointer;color:#fff;
  background:linear-gradient(145deg,#2E9BFF,#007AFF);
  box-shadow:0 10px 24px rgba(0,122,255,.40);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;transition:transform .28s cubic-bezier(.2,.9,.3,1.25),opacity .18s,box-shadow .2s}
.jp-fab:active{transform:scale(.92)}
.jp-fab .jp-num{line-height:1;letter-spacing:-.5px}
.jp.open .jp-fab{transform:scale(0) rotate(-90deg);opacity:0;pointer-events:none}
.jp-panel{position:absolute;right:0;bottom:0;width:300px;max-width:86vw;background:#fff;
  border:1px solid var(--border2);border-radius:18px;box-shadow:0 26px 64px rgba(0,0,0,.20);
  padding:16px 16px 18px;transform-origin:bottom right;opacity:0;transform:translateY(12px) scale(.82);
  pointer-events:none;transition:opacity .2s ease,transform .3s cubic-bezier(.2,.9,.3,1.22)}
.jp.open .jp-panel{opacity:1;transform:none;pointer-events:auto}
.jp-panel .row{display:flex;align-items:center;gap:10px}
.jp-x{margin-left:auto;width:28px;height:28px;border-radius:50%;border:0;background:#F2F2F7;color:var(--muted);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;flex:0 0 28px}
.jp-x:hover{background:#E8E8ED;color:var(--text);transform:rotate(90deg)}
.jp-big{font-size:40px;font-weight:750;letter-spacing:-1px;text-align:center;margin:6px 0 2px;line-height:1.1;font-variant-numeric:tabular-nums}
.jp-range{width:100%;accent-color:var(--blue);height:30px;margin:8px 0 2px;cursor:pointer}
.jp .btn.flex1{flex:1}
.jp-tot{line-height:1.3}
@media (max-width:900px){.jp{right:14px;bottom:78px}}

/* ============ 全屏弹层（背题模式等） ============ */
.sheet.full{width:100%;max-width:100%;height:100vh;max-height:100vh;border-radius:0;animation:fullIn .26s ease}
@keyframes fullIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.mask.full{background:rgba(20,20,22,.55);align-items:stretch;padding:0}
.card-full-tip{position:absolute;top:14px;right:18px;z-index:5;font-size:12px;color:var(--muted);background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:20px;padding:5px 12px;pointer-events:none}

/* ============ 题号跳转面板 → 答题卡网格 ============ */
.jp-grid{display:none;flex-direction:column;gap:11px;max-height:46vh;overflow:auto;margin-top:12px;padding:2px}
.jp-grid .jp-group{display:block}
.jp-grid .jp-glabel{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 5px 2px}
.jp-grid .jp-gcells{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.jp-grid .jp-cell{height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650;border:1px solid var(--border2);background:#fff;color:var(--sub);cursor:pointer;transition:.12s;user-select:none}
.jp-grid .jp-cell:active{transform:scale(.94)}
.jp-grid .jp-cell.done{background:var(--blue);border-color:var(--blue);color:#fff}
.jp-grid .jp-cell.correct{background:var(--green);border-color:var(--green);color:#fff}
.jp-grid .jp-cell.wrong{background:var(--red);border-color:var(--red);color:#fff}
.jp-grid .jp-cell.cur{outline:2px solid var(--text);outline-offset:1px}
.jp-slider{display:block}
.jp-panel{max-height:84vh;overflow:auto}
.jp-panel .jp-legend{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.jp-panel .jp-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub)}
.jp-panel .jp-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid var(--border2)}
.jp-panel .jp-legend i.done{background:var(--blue);border-color:var(--blue)}
.jp-panel .jp-legend i.correct{background:var(--green);border-color:var(--green)}
.jp-panel .jp-legend i.wrong{background:var(--red);border-color:var(--red)}
.jp-panel .jp-legend i.cur{outline:2px solid var(--text);outline-offset:1px}

/* ============ 背题模式全屏卡片 ============ */
.sheet.full .flipcard{height:calc(100vh - 230px);min-height:320px;cursor:pointer}
.sheet.full .face{padding:28px 26px;overflow:auto}
.sheet.full .face .fq{font-size:20px}
.sheet.full .card-answer{font-size:16px}
@media (max-width:900px){.sheet.full .flipcard{height:calc(100vh - 210px)}}

/* ============ AI 增值功能（诊断 / 加练 / 复盘 / 追问） ============ */
.ai-report{margin-top:10px}
.ai-report .ai-sec{padding:13px 15px}
.ai-report h3.rh{margin:0 0 2px;font-size:14px;color:var(--text);font-weight:700}
.ai-report .rh-sub{font-size:12px;color:var(--sub);margin-bottom:8px}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-label{width:118px;flex:none;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:12px;background:#EDEDF0;border-radius:8px;overflow:hidden;min-width:40px}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),#4DA3FF);transition:width .5s ease}
.bar-fill.soft{background:linear-gradient(90deg,#FF9F40,#FFC078)}
.bar-val{width:46px;text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.chap-toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r2);margin:6px 0;cursor:pointer;font-size:13.5px}
.chap-toggle:hover{border-color:#DCDCE2}
.chap-toggle .caret{color:var(--sub);transition:transform .2s;flex:none}
.chap-toggle.open .caret{transform:rotate(90deg)}
.chap-detail{display:none;padding:2px 11px 10px;color:var(--sub);font-size:13px;line-height:1.7}
.chap-detail.open{display:block}
.weak-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r2);margin:6px 0;font-size:13.5px}
.weak-item .wcnt{color:var(--red);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.suggest{background:var(--blue-soft);border:1px solid var(--blue-soft2);border-radius:var(--r2);padding:10px 12px;margin:6px 0;font-size:13.5px;line-height:1.65;color:var(--text)}
.suggest b{color:var(--blue)}
.conv{font-size:13.5px;line-height:1.65;padding:8px 11px;border-radius:var(--r2);margin:6px 0}
.conv-u{background:#F2F2F7;color:var(--text)}
.conv-a{background:rgba(0,122,255,.06);border:1px solid var(--blue-soft2);color:#234}
.conv b{color:var(--blue)}
.ai-followup{border-top:2px dashed rgba(0,122,255,.18)}
.follow-q{font-size:11px;color:var(--sub);text-align:right;margin-top:3px}

/* ============ AI 流式输出 / 用量统计 ============ */
.ai-stream{min-height:20px;color:var(--text);font-size:13.5px;line-height:1.7;padding:2px 2px 6px;word-break:break-word}
.ai-stream:empty::after{content:'…';color:var(--sub)}
.ai-stream::after{content:'▌';color:var(--blue);animation:blink 1s step-end infinite}
.ai-stream.done::after{content:''}
.ai-box.settled .ai-stream::after{content:''}
.ai-swap{opacity:0;transform:translateY(5px);transition:opacity .34s ease, transform .34s ease}
.ai-swap.show{opacity:1;transform:none}
@keyframes blink{50%{opacity:0}}
.pre-wrap{white-space:pre-wrap}
.ai-live{display:flex;align-items:center;gap:8px}
.au-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);padding:4px 0}
.au-row span:first-child{color:var(--sub);flex:none;width:60px}

/* ============ 通过率预测 / 学习周报 ============ */
.pass-hero{display:flex;align-items:center;gap:16px;padding:6px 2px 12px}
.pass-num{font-size:44px;font-weight:800;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.pass-num small{font-size:18px;font-weight:600}
.pass-meta{flex:1}
.pass-track{height:14px;background:#EDEDF0;border-radius:8px;overflow:hidden;margin-top:8px}
.pass-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#34C759,var(--blue));transition:width .6s ease}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.conf.hi{background:#E8F8EE;color:#1E9E45}
.conf.mid{background:#FFF4E5;color:#C77700}
.conf.lo{background:#FFECEC;color:var(--red)}
.wr-item{border:1px solid var(--border);border-radius:var(--r2);margin:6px 0;padding:9px 11px;font-size:13.5px;line-height:1.6}
.wr-week{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wr-week .cur{color:var(--blue);font-weight:700}

/* ============================================================
   GLASS THEME · 液态玻璃 UI（仅样式覆盖，不改任何逻辑）
   ============================================================ */
:root{
  --dock-height:62px;
  --capsule-r:28px;
}
html,body{background:transparent}
body{
  background-color:#F0F3FB;
  background-image:
    radial-gradient(58% 44% at 14% 8%, rgba(255,178,92,.55), transparent 64%),
    radial-gradient(50% 44% at 90% 14%, rgba(88,207,250,.48), transparent 64%),
    radial-gradient(56% 48% at 84% 90%, rgba(108,240,178,.42), transparent 66%),
    radial-gradient(46% 42% at 4% 88%, rgba(255,116,150,.32), transparent 62%),
    radial-gradient(52% 50% at 50% 44%, rgba(140,102,255,.26), transparent 68%),
    radial-gradient(30% 26% at 70% 60%, rgba(255,214,102,.22), transparent 70%),
    repeating-linear-gradient(0deg, rgba(120,140,190,.06) 0, rgba(120,140,190,.06) 1px, transparent 1px, transparent 27px),
    repeating-linear-gradient(90deg, rgba(120,140,190,.06) 0, rgba(120,140,190,.06) 1px, transparent 1px, transparent 27px);
}
.sidebar{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(26px) saturate(1.4);
  -webkit-backdrop-filter:blur(26px) saturate(1.4);
  border-right:1px solid rgba(255,255,255,.55);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.4);
}
.brand-t{color:#17181C}
.nav-item:hover{background:rgba(255,255,255,.52);color:#17181C}
.nav-item.active{background:rgba(255,255,255,.78);color:#0A66FF;box-shadow:0 3px 12px rgba(40,70,150,.10), inset 0 0 0 1px rgba(255,255,255,.85)}
.side-foot{border-top:1px solid rgba(255,255,255,.55)}
.topbar{
  background:rgba(250,251,255,.58);
  backdrop-filter:blur(24px) saturate(1.5);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);
  border-bottom:1px solid rgba(255,255,255,.55);
}
.card,.stat{
  background:linear-gradient(155deg, rgba(255,255,255,.80), rgba(255,255,255,.54));
  border:1px solid rgba(255,255,255,.70);
  box-shadow:0 10px 28px rgba(50,70,140,.09), 0 2px 6px rgba(50,70,140,.05), inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(18px) saturate(1.35);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);
}
.card.click:hover{box-shadow:0 16px 40px rgba(50,70,140,.14), inset 0 1px 0 rgba(255,255,255,.9);transform:translateY(-1px)}
.btn{
  background:rgba(255,255,255,.60);
  border-color:rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(50,70,140,.08), inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.btn:hover{background:rgba(255,255,255,.88);border-color:rgba(255,255,255,.95)}
.btn.primary{background:linear-gradient(180deg,#2E9BFF,#0A84FF);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:0 6px 18px rgba(10,132,255,.30), inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:hover{background:linear-gradient(180deg,#3AA6FF,#0A84FF)}
.btn.ghost:hover{background:rgba(10,132,255,.12)}
.btn.danger{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.danger:hover{background:rgba(255,59,48,.2)}
.btn[disabled]{background:rgba(255,255,255,.45)}
.chip{

  border-color:rgba(255,255,255,.78);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.chip:hover{border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.8)}
.chip.active{background:linear-gradient(180deg,#2E9BFF,#0A84FF);border-color:rgba(255,255,255,.5);box-shadow:0 4px 14px rgba(10,132,255,.28)}
.input,.ta{
  background:rgba(255,255,255,.58);
  border-color:rgba(150,165,205,.28);
  box-shadow:inset 0 1px 3px rgba(60,80,150,.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.input:focus,.ta:focus{background:rgba(255,255,255,.88);border-color:rgba(10,132,255,.6);box-shadow:0 0 0 3px rgba(10,132,255,.14)}
.seg{background:rgba(130,150,200,.16);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 3px rgba(40,60,120,.10);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg-item.active{background:rgba(255,255,255,.92);box-shadow:0 3px 12px rgba(40,70,140,.14)}
.opt{
  background:rgba(255,255,255,.58);
  border-color:rgba(255,255,255,.75);
  box-shadow:0 4px 16px rgba(50,70,140,.07), inset 0 1px 0 rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.opt:hover{border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.8)}
.opt .opt-key{background:rgba(255,255,255,.75);border-color:rgba(150,165,210,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.opt.sel{border-color:rgba(10,132,255,.55);background:linear-gradient(180deg, rgba(10,132,255,.14), rgba(10,132,255,.07))}
.opt.sel .opt-key{background:linear-gradient(180deg,#2E9BFF,#0A84FF);border-color:#0A84FF}
.opt.correct{border-color:rgba(52,199,89,.45);background:linear-gradient(180deg, rgba(52,199,89,.14), rgba(52,199,89,.06))}
.opt.wrong{border-color:rgba(255,59,48,.45);background:linear-gradient(180deg, rgba(255,59,48,.13), rgba(255,59,48,.06))}
.judge-btn{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.78);box-shadow:0 4px 16px rgba(50,70,140,.07), inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.judge-btn.sel{border-color:rgba(10,132,255,.55);background:rgba(10,132,255,.15)}
.judge-btn.correct{border-color:rgba(52,199,89,.5);background:rgba(52,199,89,.16)}
.judge-btn.wrong{border-color:rgba(255,59,48,.5);background:rgba(255,59,48,.15)}
.qitem{
  background:rgba(255,255,255,.60);
  border-color:rgba(255,255,255,.75);
  box-shadow:0 4px 14px rgba(50,70,140,.07), inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.qitem:hover{border-color:rgba(255,255,255,.95);box-shadow:0 8px 22px rgba(50,70,140,.12)}
.fill-idx{background:rgba(255,255,255,.75);color:var(--sub);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.analysis-box{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fb{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fb.good{background:rgba(52,199,89,.15);border-color:rgba(52,199,89,.3)}
.fb.bad{background:rgba(255,59,48,.14);border-color:rgba(255,59,48,.3)}
.flipcard .face{
  background:linear-gradient(160deg, rgba(255,255,255,.86), rgba(255,255,255,.68));

/* ============ 液态玻璃 Dock（移动端底栏） ============ */
.glass-dock{
  position:relative;
  display:flex;
  align-items:center;
  width:100%;
  max-width:520px;
  height:var(--dock-height);
  pointer-events:auto;
  border-radius:calc(var(--dock-height) / 2);
  overflow:hidden;
  background:
    linear-gradient(168deg,
      rgba(255,255,255,.72) 0%,
      rgba(255,255,255,.36) 30%,
      rgba(255,255,255,.40) 55%,
      rgba(255,255,255,.58) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.62),
    inset 0 1px 1px rgba(255,255,255,.95),
    inset 0 -1px 2px rgba(255,255,255,.42),
    inset 0 4px 14px rgba(255,255,255,.30),
    inset 0 -8px 20px rgba(255,255,255,.16),
    0 18px 40px rgba(24,40,90,.16),
    0 5px 14px rgba(24,40,90,.10);
  backdrop-filter:url(#dock-refract) blur(10px) contrast(1.16) brightness(1.12) saturate(1.8);
  -webkit-backdrop-filter:url(#dock-refract) blur(10px) contrast(1.16) brightness(1.12) saturate(1.8);
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}
.glass-dock:after{
  content:"";position:absolute;left:5%;right:5%;top:0;height:46%;
  border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
  pointer-events:none;z-index:1;
  filter:blur(2px);
}
.glass-dock .dock-item{
  position:relative;
  z-index:5;
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:none;outline:none;background:none;padding:0;margin:0;
  font-family:inherit;cursor:pointer;pointer-events:auto;
  color:rgba(40,50,90,.46);
  transition:color .3s ease;
}
.glass-dock .dock-item.active{color:rgba(20,28,66,.96)}
.glass-dock .dock-ico{display:flex;align-items:center;justify-content:center;line-height:0}
.glass-dock .dock-ico svg{width:22px;height:22px;display:block;filter:drop-shadow(0 1px 1px rgba(255,255,255,.7))}
.glass-dock .dock-txt{font-size:10.5px;font-weight:500;line-height:1;letter-spacing:.02em;pointer-events:none}
.glass-dock .dock-badge{
  position:absolute;top:6px;right:calc(50% - 18px);
  min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:linear-gradient(135deg,#FF5B4D,#FF3B30);color:#fff;
  font-size:9.5px;line-height:15px;text-align:center;font-weight:700;
  box-shadow:0 2px 7px rgba(255,59,48,.4);
  pointer-events:none;z-index:6;
}
.glass-dock .dock-highlight{
  position:absolute;
  top:4px;left:0;
  height:calc(var(--dock-height) - 8px);
  border-radius:var(--capsule-r);
  z-index:2;
  pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.40), rgba(255,255,255,.14) 52%, rgba(255,255,255,.30));
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:
    0 4px 10px rgba(30,45,90,.08),
    inset 0 0 0 1px rgba(255,255,255,.32);
  will-change:left,transform;
}
.glass-dock .dock-highlight:before{
  content:"";position:absolute;top:3px;left:16%;right:16%;height:42%;
  background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
  border-radius:50%;filter:blur(4px);pointer-events:none;
}
.glass-dock .dock-svg{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:900px){
  .tabbar{
    display:flex;
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    justify-content:center;
    padding:0 12px calc(16px + env(safe-area-inset-bottom));
    /* 完全透明托底：上下均无白色渐变，Dock 下缘不再发白 */
    background:transparent;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    border-top:none;
    pointer-events:none;
  }
  .content{padding-bottom:128px}
  .toast-root{bottom:124px}
  .jp{bottom:128px}
}
@media (max-width:480px){
  :root{--dock-height:58px;--capsule-r:24px}
  .glass-dock .dock-ico svg{width:21px;height:21px}
  .glass-dock .dock-txt{font-size:10px}
}

<script>
/*
|---------------------------------------------------------------------------
| 铁路安全与铁路信息 · 智能刷题与辅助记忆系统（单文件离线版）
|---------------------------------------------------------------------------
| 用户可通过导入功能，上传按规范整理的 Excel/CSV/JSON 文件来加载题库。
| 系统会自动识别多工作表、多逻辑表格块，并以文件名作为题库名称。
|
| 技术要点：
|  1) 数据持久化使用 IndexedDB（banks / questions / stats / settings / exams）
|  2) 内置精简 XLSX 解析：原生 DecompressionStream 解压 + 纯 JS inflate 兜底
|  3) 万题级性能：全量内存索引 + 虚拟列表渲染
|  4) 记忆引擎：简化版 SM-2 间隔重复 + 连续答对消灭机制
|  5) 简答题：关键词命中率 + 文本相似度 + 完整度 三维启发式离线评分
|---------------------------------------------------------------------------
*/
(function(){
'use strict';

/* ============================================================
 * 0. 基础工具
 * ========================================================== */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function fmtDate(t){ if(!t) return '—'; var d=new Date(t); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtDur(ms){ var s=Math.round(ms/1000); var m=Math.floor(s/60); s=s%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function fmtAgo(t){ if(!t) return '从未'; var d=Date.now()-t; if(d<60000) return '刚刚'; if(d<3600000) return Math.floor(d/60000)+'分钟前';
  if(d<86400000) return Math.floor(d/3600000)+'小时前'; if(d<2592000000) return Math.floor(d/86400000)+'天前'; return fmtDate(t); }
function buzz(ms){
  try{ if(AppState.settings && AppState.settings.ui.vibrate && navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
function toast(msg, ms){
  var el=document.createElement('div'); el.className='toast'; el.innerHTML=msg;
  $('#toastRoot').appendChild(el);
  setTimeout(function(){ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateY(6px)';
    setTimeout(function(){ el.remove(); }, 320); }, ms||2200);
}
function copyText(t){
  try{ navigator.clipboard.writeText(t); toast('已复制到剪贴板'); }catch(e){ toast('复制失败'); }
}

/* 简易弹层 */
var Modal = {
  open: function(opt){
    var mask=document.createElement('div'); mask.className='mask'+(opt.bottom?' bottom':'')+(opt.full?' full':'');
    mask.innerHTML =
      '<div class="sheet'+(opt.full?' full':'')+'">'+
        (opt.full?'<div class="card-full-tip">可随时退出</div>':'')+
        '<div class="sheet-head"><div><h3>'+esc(opt.title||'')+'</h3>'+(opt.sub?'<div class="small muted mt4">'+opt.sub+'</div>':'')+'</div>'+
        '<div class="xclose" data-close>&times;</div></div>'+
        '<div class="sheet-body">'+opt.body+'</div>'+
        (opt.foot?'<div class="sheet-foot">'+opt.foot+'</div>':'')+
      '</div>';
    $('#modalRoot').appendChild(mask);
    mask._onClose = opt.onClose || null;
    mask.addEventListener('click', function(e){
      if(e.target===mask || e.target.hasAttribute('data-close')) Modal.close(mask);
    });
    if(opt.onMount) opt.onMount(mask);
    return mask;
  },
  close: function(m){
    var mask = m || $('#modalRoot').lastElementChild;
    if(!mask || mask.classList.contains('closing')) return;
    mask.classList.add('closing');
    var cb = mask._onClose;
    setTimeout(function(){ if(mask.parentNode) mask.remove(); if(cb) try{ cb(); }catch(_){} }, 210);
  },
  closeAll: function(){ $('#modalRoot').innerHTML=''; }
};
/* 全局水波纹：点击按钮 / 导航 / 选项等元素时，从点击位置扩散一圈波纹（纯视觉反馈） */
function initRipple(){
  var SEL='.btn,.chip,.nav-item,.opt,.judge-btn,.seg-item,.qitem,.xclose,.jp-cell';
  document.addEventListener('pointerdown', function(e){
    var t=e.target;
    if(!t || !t.closest) return;
    var el=t.closest(SEL);
    if(!el || el.disabled || el.classList.contains('disabled')) return;
    var r=el.getBoundingClientRect();
    if(!r.width || !r.height) return;
    var size=Math.max(r.width, r.height);
    var sp=document.createElement('span');
    sp.className='ripple';
    sp.style.width=sp.style.height=size+'px';
    sp.style.left=(e.clientX-r.left-size/2)+'px';
    sp.style.top=(e.clientY-r.top-size/2)+'px';
    el.appendChild(sp);
    setTimeout(function(){ if(sp.parentNode) sp.remove(); }, 560);
  }, true);
}
function confirmBox(title, msg, okText, onOk, danger){
  Modal.open({
    title: title,
    body: '<div class="small" style="line-height:1.8">'+msg+'</div>',

    onMount: function(m){
      m.querySelector('#_ok').onclick=function(){ Modal.close(m); onOk&&onOk(); };
    }

}
function promptBox(title, label, value, onOk){
  Modal.open({
    title: title,
    body: '<div class="field"><div class="label">'+esc(label)+'</div><input class="input" id="_pv" value="'+esc(value||'')+'"></div>',
    foot: '<button class="btn" data-close>取消</button><button class="btn primary" id="_ok">保存</button>',
    onMount: function(m){
      var i=m.querySelector('#_pv'); setTimeout(function(){ i.focus(); i.select(); },80);
      m.querySelector('#_ok').onclick=function(){ var v=i.value.trim(); if(!v){ toast('名称不能为空'); return; } Modal.close(m); onOk&&onOk(v); };
      i.addEventListener('keydown', function(e){ if(e.key==='Enter') m.querySelector('#_ok').click(); });

  });
}

/* ============================================================
 * 1. IndexedDB 持久层
 * ========================================================== */
var DB = {
  db: null,
  name: 'railway_exam_db',
  ver: 4,
  open: function(){
    var self=this;
    return new Promise(function(res, rej){
      if(self.db) return res(self.db);
      var rq = indexedDB.open(self.name, self.ver);
      rq.onupgradeneeded = function(e){
        var d = e.target.result;
        if(!d.objectStoreNames.contains('banks')) d.createObjectStore('banks', {keyPath:'id'});
        if(!d.objectStoreNames.contains('questions')){
          var qs = d.createObjectStore('questions', {keyPath:'id'});
          qs.createIndex('bankId','bankId',{unique:false});
        }
        if(!d.objectStoreNames.contains('stats')){
          var ss = d.createObjectStore('stats', {keyPath:'qid'});
          ss.createIndex('nextReviewDate','nextReviewDate',{unique:false});
          ss.createIndex('inWrong','inWrong',{unique:false});
        }
        if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', {keyPath:'key'});
        if(!d.objectStoreNames.contains('exams')) d.createObjectStore('exams', {keyPath:'id'});
        if(!d.objectStoreNames.contains('progress')) d.createObjectStore('progress', {keyPath:'key'});
        if(!d.objectStoreNames.contains('reports')) d.createObjectStore('reports', {keyPath:'id'});
      };
      rq.onsuccess = function(e){ self.db = e.target.result; res(self.db); };
      rq.onerror = function(e){ rej(e.target.error); };
    });
  },
  tx: function(stores, mode){
    return this.db.transaction(stores, mode||'readonly');
  },
  req: function(r){
    return new Promise(function(res, rej){ r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; });
  },
  getAll: function(store){ var self=this; return this.open().then(function(){ return self.req(self.tx(store).objectStore(store).getAll()); }); },
  get: function(store, key){ var self=this; return this.open().then(function(){ return self.req(self.tx(store).objectStore(store).get(key)); }); },
  put: function(store, val){ var self=this; return this.open().then(function(){ return self.req(self.tx(store,'readwrite').objectStore(store).put(val)); }); },
  del: function(store, key){ var self=this; return this.open().then(function(){ return self.req(self.tx(store,'readwrite').objectStore(store).delete(key)); }); },
  clear: function(store){ var self=this; return this.open().then(function(){ return self.req(self.tx(store,'readwrite').objectStore(store).clear()); }); },
  /* 批量写入，分片事务，避免长事务卡顿 */
  bulkPut: function(store, arr, chunk){
    var self=this; chunk = chunk||800;
    return this.open().then(function(){
      return new Promise(function(res, rej){
        var i=0;
        function step(){
          if(i>=arr.length) return res(true);
          var end=Math.min(i+chunk, arr.length);
          var t=self.tx(store,'readwrite'); var os=t.objectStore(store);
          for(; i<end; i++) os.put(arr[i]);
          t.oncomplete=function(){ step(); };
          t.onerror=function(e){ rej(e.target.error); };
          t.onabort=function(e){ rej(e.target.error); };
        }
        step();
      });
    });
  },
  bulkDelete: function(store, keys){
    var self=this;
    return this.open().then(function(){
      return new Promise(function(res,rej){
        var t=self.tx(store,'readwrite'); var os=t.objectStore(store);
        keys.forEach(function(k){ os.delete(k); });
        t.oncomplete=function(){ res(true); };
        t.onerror=function(e){ rej(e.target.error); };
      });
    });
  },
  wipe: function(){
    var self=this;
    return this.open().then(function(){
      return Promise.all(['banks','questions','stats','exams'].map(function(s){ return self.clear(s); }));
    });
  }
};

 * 2. 全局状态 AppState
 * ========================================================== */
var DEFAULT_SETTINGS = {
  llm: {
    name: '', providerId: '', model: 'gpt-4o-mini', apiKey: '',
    baseUrl: 'https://api.openai.com/v1', protocol: 'openai',
    encKey: true,
    contextWindow: 8192, temperature: 0.3,
    thinkDepth: 'mid'   /* AI 思考深度：off / low / mid / high / deep */
  },
  scoring: {

    wKeyword: 45, wSimilarity: 35, wLength: 20

function deepMerge(base, patch){
  var out = {};
  for(var k in base){
    if(patch && patch[k]!==undefined && patch[k]!==null){
      if(Object.prototype.toString.call(base[k])==='[object Object]' && Object.prototype.toString.call(patch[k])==='[object Object]') out[k]=deepMerge(base[k], patch[k]);
      else out[k]=patch[k];
    } else out[k]=base[k];
  }
  for(var k2 in patch){ if(!(k2 in out)) out[k2]=patch[k2]; }
  return out;
}
/* 深色模式（暗黑/夜间）：根据设置切换 html.dark，使 DARK MODE 样式层整体生效 */
function applyTheme(){

/* ---- API Key 本地混淆加密（设备随机密钥 + XOR + base64，防直接明文读取） ---- */
function devKey(){
  try{
    var k=localStorage.getItem('_rex_devk');
    if(!k){ var a=new Uint8Array(24); crypto.getRandomValues(a);
      k=btoa(String.fromCharCode.apply(null,a)); localStorage.setItem('_rex_devk',k); }
    return k;
  }catch(e){ return 'rex-local-fallback-key'; }
}
function encStr(s){
  if(!s) return s;
  try{
    var k=devKey(), out='';
    for(var i=0;i<s.length;i++) out+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));
    return 'enc1:'+btoa(unescape(encodeURIComponent(out)));
  }catch(e){ return s; }
}
function decStr(s){
  if(!s || String(s).indexOf('enc1:')!==0) return s;
  try{
    var raw=decodeURIComponent(escape(atob(String(s).slice(5)))), k=devKey(), out='';
    for(var i=0;i<raw.length;i++) out+=String.fromCharCode(raw.charCodeAt(i)^k.charCodeAt(i%k.length));
    return out;
  }catch(e){ return ''; }
}
function getStat(qid){

    s = { qid:qid, wrongCount:0, correctCount:0, totalCount:0, accuracy:0,
          lastWrongTime:0, lastTime:0, streak:0, mastered:false, inWrong:false,
          nextReviewDate:0, ease:2.5, interval:0, reps:0 };
    AppState.stats.set(qid, s);
  }
  return s;
}
/* 简化版 SM-2：答对延长间隔，答错重置 */
function updateStat(qid, correct, quality){
  var s = getStat(qid), cfg = AppState.settings.srs, now = Date.now();
  s.totalCount++; s.lastTime = now;
  var q = quality==null ? (correct?4:1) : quality;
  if(correct){
    s.correctCount++; s.streak++;
    s.ease = clamp(s.ease + (0.1 - (5-q)*(0.08 + (5-q)*0.02)), 1.3, 2.8);
    s.reps++;
    if(s.reps===1) s.interval = cfg.firstInterval;
    else if(s.reps===2) s.interval = cfg.secondInterval;
    else s.interval = clamp(Math.round(s.interval * s.ease), 1, cfg.maxInterval);
    s.nextReviewDate = today0() + s.interval*86400000;
    if(s.streak >= cfg.graduateCount){ s.mastered = true; s.inWrong = false; }
  }else{
    s.wrongCount++; s.streak = 0; s.lastWrongTime = now;
    s.inWrong = true; s.mastered = false; s.reps = 0; s.interval = 0;
    s.ease = clamp(s.ease - 0.2, 1.3, 2.8);
    s.nextReviewDate = today0(); /* 当天即可再次复习 */
  }
  s.accuracy = s.totalCount ? s.correctCount / s.totalCount : 0;
  AppState.dirty.add(qid);
  flushStats();
  return s;
}

function dailyAdd(n, correct){
  var t0 = today0();
  if(AppState.daily.date !== t0){ AppState.daily = {date:t0, count:0}; }
  AppState.daily.count += n;
  /* 每日学习快照（供学习周报使用）：done=答题数 wrong=答错数 */

 * 4. 本地解析引擎：ZIP / Inflate / XLSX / CSV / JSON
